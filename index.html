<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kavach — Money Copilot for Digital India</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React and ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #fbfbf9;
      color: #1c1917;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="bg-[#fbfbf9] text-stone-900 antialiased selection:bg-amber-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // SVG Icons
    const IconShield = ({ className = "w-5 h-5" }) => (

    const IconShieldAlert = ({ className = "w-5 h-5" }) => (

    const IconAlertTriangle = ({ className = "w-7 h-7" }) => (

        <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/>

        <line x1="12" y1="17" x2="12.01" y2="17"/>

    const IconRotateCcw = ({ className = "w-4 h-4" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
        <path d="M3 3v5h5"/>
      </svg>
    );

    const IconWallet = ({ className = "w-5 h-5" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/>
        <path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/>

    const IconCoins = ({ className = "w-5 h-5" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
        <circle cx="8" cy="8" r="6"/>
        <path d="M18.09 10.37A6 6 0 1 1 10.34 18"/>
        <path d="M7 6h1v4"/>
        <path d="m16.71 13.88.7.71-2.82 2.82"/>
      </svg>
    );

    const IconHome = ({ className = "w-5 h-5" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
    );

    const IconSparkles = ({ className = "w-4 h-4" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
      </svg>
    );

    const IconArrowRight = ({ className = "w-4 h-4" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"/>
        <polyline points="12 5 19 12 12 19"/>
      </svg>
    );

    const IconChevronRight = ({ className = "w-4 h-4" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <polyline points="9 18 15 12 9 6"/>
      </svg>
    );

    const IconLock = ({ className = "w-3.5 h-3.5" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
    );

    const IconCheckCircle2 = ({ className = "w-6 h-6" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <path d="m9 12 2 2 4-4"/>
      </svg>
    );

    const IconX = ({ className = "w-5 h-5" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    );

    const IconXCircle = ({ className = "w-4 h-4" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <path d="m15 9-6 6"/>
        <path d="m9 9 6 6"/>
      </svg>
    );

    const IconLaptop = ({ className = "w-6 h-6" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M20 16V7a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v9m16 0H4m16 0 1.28 2.55a1 1 0 0 1-.9 1.45H3.62a1 1 0 0 1-.9-1.45L4 16"/>
      </svg>
    );

    const IconRepeat = ({ className = "w-5 h-5" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="m17 2 4 4-4 4"/>
        <path d="M3 11v-1a4 4 0 0 1 4-4h14"/>
        <path d="m7 22-4-4 4-4"/>
        <path d="M21 13v1a4 4 0 0 1-4 4H3"/>
      </svg>
    );

    const IconShoppingBag = ({ className = "w-5 h-5" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/>
        <path d="M3 6h18"/>
        <path d="M16 10a4 4 0 0 1-8 0"/>
      </svg>
    );

    const IconCoffee = ({ className = "w-5 h-5" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M17 8h1a4 4 0 1 1 0 8h-1"/>
        <path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"/>
        <line x1="6" y1="2" x2="6" y2="4"/>
        <line x1="10" y1="2" x2="10" y2="4"/>
        <line x1="14" y1="2" x2="14" y2="4"/>
      </svg>
    );

    const IconTrain = ({ className = "w-5 h-5" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <rect width="16" height="16" x="4" y="3" rx="2"/>
        <path d="M4 11h16"/>
        <path d="M12 3v8"/>
        <path d="m8 19-2 3"/>
        <path d="m18 22-2-3"/>
        <circle cx="8" cy="15" r="1"/>
        <circle cx="16" cy="15" r="1"/>
      </svg>
    );

    const IconUploadCloud = ({ className = "w-4 h-4" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/>
        <path d="M12 12v9"/>
        <path d="m16 16-4-4-4 4"/>
      </svg>
    );

    const IconSmartphone = ({ className = "w-5 h-5" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <rect width="14" height="20" x="5" y="2" rx="2" ry="2"/>
        <path d="M12 18h.01"/>
      </svg>
    );

    const IconGraduationCap = ({ className = "w-5 h-5" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"/>
        <path d="M22 10v6"/>
        <path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"/>
      </svg>
    );

    const IconTrendingUp = ({ className = "w-4 h-4" }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/>
        <polyline points="16 7 22 7 22 13"/>
      </svg>
    );

    // ====================================================
    // SIGN UP MODAL COMPONENT (4-Step Onboarding Process)
    // ====================================================
    function SignUpModal({ isOpen, onClose, onComplete, lang }) {
      const [step, setStep] = useState(1);
      const [name, setName] = useState('');
      const [phone, setPhone] = useState('');
      const [otp, setOtp] = useState(['', '', '', '']);
      const [selectedPersona, setSelectedPersona] = useState('student');
      const [errorMsg, setErrorMsg] = useState('');
      const [isVerifying, setIsVerifying] = useState(false);

      if (!isOpen) return null;

      const t = {
        en: {
          title: "Join Kavach",
          subtitle: "Set up your free UPI protection copilot in under 60 seconds.",
          step1Sub: "Enter your name & primary UPI mobile number.",
          nameLabel: "Your Full Name",
          namePlaceholder: "e.g. Shreyas Patel",
          phoneLabel: "Mobile Number (Linked with UPI)",
          phonePlaceholder: "98765 43210",
          sendOtpBtn: "Send 4-Digit OTP",
          step2Title: "Verify Your Number",
          step2Sub: `Code sent to +91 ${phone || '9876543210'}`,
          autoFillBtn: "Auto-Fill 2426",
          verifyBtn: "Verify & Continue",
          step3Title: "How do you earn & spend?",
          step3Sub: "Kavach personalizes your payout cycles based on your lifestyle.",
          personaStudent: "College Student / Intern",
          personaStudentDesc: "Stipends, monthly allowances, college projects",
          personaFreelance: "Freelancer / Creator",
          personaFreelanceDesc: "Gig payouts, client invoices, Razorpay payouts",
          personaJunior: "Early Career Professional",
          personaJuniorDesc: "First salary, rent splits, weekend social spends",
          completeBtn: "Activate Protection",
          step4Title: "Protection Activated!",
          step4Sub: "Kavach Copilot is now active. Your UPI intents are safeguarded before PIN entry.",
          exploreBtn: "Go to Scam Shield"
        },
        hi: {
          title: "कवच से जुड़ें",
          subtitle: "60 सेकंड के भीतर अपना निःशुल्क UPI सुरक्षा साथी शुरू करें।",
          step1Sub: "अपना नाम और प्राथमिक UPI मोबाइल नंबर दर्ज करें।",
          nameLabel: "आपका पूरा नाम",
          namePlaceholder: "उदा. श्रेयस पटेल",
          phoneLabel: "मोबाइल नंबर (UPI से जुड़ा)",
          phonePlaceholder: "98765 43210",
          sendOtpBtn: "4-अंकीय OTP भेजें",
          step2Title: "नंबर सत्यापित करें",
          step2Sub: `कोड +91 ${phone || '9876543210'} पर भेजा गया`,
          autoFillBtn: "ऑटो-फिल 2426",
          verifyBtn: "सत्यापित करें और आगे बढ़ें",
          step3Title: "आपकी आय और खर्च का प्रकार",
          step3Sub: "कवच आपके पेआउट साइकल्स को आपकी जीवनशैली के अनुसार अनुकूलित करता है।",
          personaStudent: "कॉलेज छात्र / इंटर्न",
          personaStudentDesc: "स्टाइपेंड, पॉकेट मनी, कॉलेज प्रोजेक्ट्स",
          personaFreelance: "फ्रीलांसर / कंटेंट क्रिएटर",
          personaFreelanceDesc: "गिग पेमेंट्स, अनियमित इनवॉइस, विभिन्न क्लाइंट्स",
          personaJunior: "नवागंतुक कर्मचारी (Early Career)",
          personaJuniorDesc: "मासिक वेतन, किराया विभाजन, सप्ताहांत के खर्च",
          completeBtn: "सुरक्षा सक्रिय करें",
          step4Title: "सुरक्षा सक्रिय हो चुकी है!",
          step4Sub: "कवच सुरक्षा अब सक्रिय है। आपके सभी UPI भुगतान पिन डालने से पहले जाँचे जाएंगे।",
          exploreBtn: "स्कैम शील्ड खोलें"
        }
      };

      const text = t[lang] || t.en;

      const handleStep1Submit = (e) => {
        e.preventDefault();
        if (!name.trim()) {
          setErrorMsg(lang === 'en' ? 'Please enter your name' : 'कृपया अपना नाम दर्ज करें');
          return;
        }
        if (phone.replace(/\D/g, '').length < 10) {
          setErrorMsg(lang === 'en' ? 'Enter a valid 10-digit number' : 'वैध 10-अंकीय नंबर दर्ज करें');
          return;
        }
        setErrorMsg('');
        setStep(2);
      };

      const handleAutoFillOtp = () => {
        setOtp(['2', '4', '2', '6']);
        setErrorMsg('');
      };

      const handleStep2Submit = (e) => {
        e.preventDefault();
        if (otp.join('').length < 4) {
          setErrorMsg(lang === 'en' ? 'Please enter 4 digits' : 'कृपया 4 अंक दर्ज करें');
          return;
        }
        setErrorMsg('');
        setIsVerifying(true);
        setTimeout(() => {
          setIsVerifying(false);
          setStep(3);
        }, 700);
      };

      const handleStep3Submit = () => {
        setStep(4);
        if (onComplete) {
          onComplete({
            name: name || 'Shreyas Patel',
            phone: phone || '9876543210',
            persona: selectedPersona
          });
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-stone-900/60 backdrop-blur-sm animate-fade-in">
          <div className="relative w-full max-w-md bg-white rounded-3xl border-2 border-stone-300 shadow-2xl overflow-hidden p-6 sm:p-7 text-stone-900">
            
            <button
              type="button"
              onClick={onClose}
              className="absolute top-4 right-4 w-10 h-10 rounded-full bg-stone-100 hover:bg-stone-200 flex items-center justify-center text-stone-600 transition-colors cursor-pointer"
            >
              <IconX className="w-5 h-5" />
            </button>

            <div className="flex items-center gap-1.5 mb-5">
              {[1, 2, 3, 4].map((s) => (
                <div
                  key={s}
                  className={`h-1.5 rounded-full transition-all duration-300 ${
                    s === step
                      ? 'w-8 bg-stone-900'
                      : s < step
                      ? 'w-4 bg-emerald-500'
                      : 'w-4 bg-stone-200'
                  }`}
                />
              ))}
              <span className="text-[11px] font-bold text-stone-400 ml-auto uppercase tracking-wider">
                Step {step} of 4
              </span>
            </div>

            {step === 1 && (
              <form onSubmit={handleStep1Submit} className="space-y-4 text-left">
                <div>
                  <div className="w-11 h-11 rounded-2xl bg-amber-100 text-amber-800 flex items-center justify-center mb-3">
                    <IconSmartphone className="w-5 h-5" />
                  </div>
                  <h2 className="text-2xl font-black text-stone-900">{text.title}</h2>
                  <p className="text-xs sm:text-sm text-stone-600 mt-1">{text.step1Sub}</p>
                </div>

                <div>
                  <label className="block text-xs font-bold uppercase tracking-wider text-stone-700 mb-1.5">{text.nameLabel}</label>
                  <input
                    type="text"
                    value={name}
                    onChange={(e) => setName(e.target.value)}
                    placeholder={text.namePlaceholder}
                    className="w-full min-h-[50px] bg-stone-50 border border-stone-300 rounded-xl px-4 text-base text-stone-900 focus:bg-white focus:border-stone-900 outline-none"
                    required
                  />
                </div>

                <div>
                  <label className="block text-xs font-bold uppercase tracking-wider text-stone-700 mb-1.5">{text.phoneLabel}</label>
                  <div className="flex items-center">
                    <span className="min-h-[50px] px-3.5 bg-stone-100 border border-r-0 border-stone-300 rounded-l-xl flex items-center text-sm font-bold text-stone-600">+91</span>
                    <input
                      type="tel"
                      maxLength={10}
                      value={phone}
                      onChange={(e) => setPhone(e.target.value.replace(/\D/g, ''))}
                      placeholder={text.phonePlaceholder}
                      className="flex-1 min-h-[50px] bg-stone-50 border border-stone-300 rounded-r-xl px-4 text-base text-stone-900 focus:bg-white focus:border-stone-900 outline-none"
                      required
                    />
                  </div>
                </div>

                {errorMsg && <p className="text-rose-600 text-xs font-bold">{errorMsg}</p>}

                <button
                  type="submit"
                  className="w-full min-h-[50px] rounded-xl bg-stone-900 hover:bg-stone-800 text-white font-bold text-base flex items-center justify-center gap-2 cursor-pointer shadow-md"
                >
                  <span>{text.sendOtpBtn}</span>
                  <IconArrowRight className="w-4 h-4" />
                </button>
              </form>
            )}

            {step === 2 && (
              <form onSubmit={handleStep2Submit} className="space-y-5 text-left">
                <div>
                  <div className="w-11 h-11 rounded-2xl bg-blue-100 text-blue-800 flex items-center justify-center mb-3">
                    <IconCheckCircle2 className="w-5 h-5" />
                  </div>
                  <h2 className="text-2xl font-black text-stone-900">{text.step2Title}</h2>
                  <p className="text-xs sm:text-sm text-stone-600 mt-1">{text.step2Sub}</p>
                </div>

                <div className="flex justify-between gap-2.5 max-w-[260px] mx-auto">
                  {otp.map((digit, idx) => (
                    <input
                      key={idx}
                      id={`otp-${idx}`}
                      type="text"
                      maxLength={1}
                      value={digit}
                      onChange={(e) => {
                        const val = e.target.value;
                        const newOtp = [...otp];
                        newOtp[idx] = val;
                        setOtp(newOtp);
                        if (val && idx < 3) document.getElementById(`otp-${idx + 1}`)?.focus();
                      }}
                      className="w-14 h-14 text-center text-2xl font-black bg-stone-50 border-2 border-stone-300 rounded-2xl focus:bg-white focus:border-stone-900 outline-none"
                    />
                  ))}
                </div>

                <div className="text-center">
                  <button
                    type="button"
                    onClick={handleAutoFillOtp}
                    className="inline-flex items-center gap-1 px-3 py-1.5 rounded-lg bg-stone-100 hover:bg-stone-200 text-xs font-bold text-stone-800 border border-stone-300 cursor-pointer"
                  >
                    <span>⚡ {text.autoFillBtn}</span>
                  </button>
                </div>

                {errorMsg && <p className="text-rose-600 text-xs font-bold text-center">{errorMsg}</p>}

                <button
                  type="submit"
                  disabled={isVerifying}
                  className="w-full min-h-[50px] rounded-xl bg-stone-900 hover:bg-stone-800 text-white font-bold text-base flex items-center justify-center gap-2 cursor-pointer shadow-md"
                >
                  <span>{isVerifying ? "Verifying..." : text.verifyBtn}</span>
                  <IconArrowRight className="w-4 h-4" />
                </button>
              </form>
            )}

            {step === 3 && (
              <div className="space-y-4 text-left">
                <div>
                  <div className="w-11 h-11 rounded-2xl bg-emerald-100 text-emerald-800 flex items-center justify-center mb-3">
                    <IconSparkles className="w-5 h-5" />
                  </div>
                  <h2 className="text-2xl font-black text-stone-900">{text.step3Title}</h2>
                  <p className="text-xs sm:text-sm text-stone-600 mt-1">{text.step3Sub}</p>
                </div>

                <div className="space-y-2.5">
                  {[
                    { id: 'student', title: text.personaStudent, desc: text.personaStudentDesc, icon: IconGraduationCap },
                    { id: 'freelance', title: text.personaFreelance, desc: text.personaFreelanceDesc, icon: IconLaptop },
                    { id: 'junior', title: text.personaJunior, desc: text.personaJuniorDesc, icon: IconWallet }
                  ].map((p) => {
                    const Icon = p.icon;
                    const isSelected = selectedPersona === p.id;
                    return (
                      <button
                        key={p.id}
                        type="button"
                        onClick={() => setSelectedPersona(p.id)}

          {/* Bottom Sticky Tab Bar */}
          <nav className="fixed bottom-0 left-0 right-0 z-40 bg-[#fbfbf9]/95 backdrop-blur-lg border-t border-stone-200/90 shadow-[0_-4px_20px_rgba(0,0,0,0.05)]">
            <div className="max-w-md md:max-w-4xl mx-auto px-3 flex items-center justify-around h-20">
              {navItems.map((item) => {
                const Icon = item.icon;
                const isActive = currentRoute === item.to;
                return (
                  <button
                    key={item.to}
                    type="button"
                    onClick={() => navigate(item.to)}
                    className={`flex flex-col items-center justify-center flex-1 min-h-[48px] min-w-[48px] py-1 rounded-2xl transition-all cursor-pointer ${
                      isActive ? 'text-stone-950 font-extrabold' : 'text-stone-500 hover:text-stone-800 font-medium'
                    }`}
                  >
                    <div className={`w-10 h-8 rounded-xl flex items-center justify-center mb-0.5 transition-all ${
                      isActive ? 'bg-stone-900 text-amber-400 shadow-sm scale-105' : 'text-stone-500 hover:bg-stone-200/60'
                    }`}>
                      <Icon className="w-5 h-5" />
                    </div>
                    <span className="text-[11px] tracking-tight font-bold">{item.label}</span>
                    {isActive && <span className="w-1.5 h-1.5 bg-amber-500 rounded-full mt-0.5"></span>}
                  </button>
                );
              })}
            </div>
          </nav>

          {/* Interactive Sign Up Modal */}
          <SignUpModal
            isOpen={isSignUpOpen}
            onClose={() => setIsSignUpOpen(false)}
            onComplete={(userData) => setUser(userData)}
            lang={lang}
          />

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
