                  {(() => {
                    const saved = Number(primaryGoal.current_amount || primaryGoal.saved || 0);
                    const target = Number(primaryGoal.target_amount || primaryGoal.target || 1);
                    const pct = Math.min(100, Math.round((saved / target) * 100));
                    return (
                      <div>
                        <p className="text-xs text-slate-500 dark:text-slate-400 mb-3 font-medium">
                          {pct}% Achieved • ₹{saved.toLocaleString('en-IN')} of ₹{target.toLocaleString('en-IN')} saved
                        </p>
                        <div className="w-full h-2.5 bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden mb-3">
                          <div className="h-full bg-gradient-to-r from-emerald-500 to-teal-500 rounded-full" style={{ width: `${pct}%` }} />
                        </div>
                      </div>
                    );
                  })()}
                </div>
              ) : (
                <div className="py-6 text-center text-slate-400 text-xs flex flex-col items-center justify-center space-y-1 my-auto">
                  <IconTarget className="w-6 h-6 text-slate-300 dark:text-slate-600 mb-1" />
                  <p className="font-semibold text-slate-600 dark:text-slate-300">No active savings goals</p>
                  <p className="text-slate-400 max-w-xs">Create a savings target to track your milestone progress and unlock safe spending envelopes.</p>
                </div>
              )}

              <button
                onClick={() => onNavigate('/goals')}
                className="text-xs font-semibold text-blue-600 dark:text-blue-400 hover:text-blue-700 dark:hover:text-blue-300 mt-4 flex items-center gap-1 cursor-pointer transition-colors"
              >
                <span>{primaryGoal ? 'View All Personal Goals' : 'Create a New Goal'}</span>
                <IconArrowRight className="w-3.5 h-3.5" />
              </button>
            </div>
          </div>
        </div>
      );
    }
    // ==========================================
    // 3. GOALS PAGE (Live Database Connection)
    // ==========================================
    function GoalsPage() {
      const [goals, setGoals] = useState([]);
      const [loading, setLoading] = useState(true);
      const [customAmounts, setCustomAmounts] = useState({});
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [goalMode, setGoalMode] = useState('purchase'); // 'purchase' | 'daily'
      const [dailyAmtInput, setDailyAmtInput] = useState('200');
      const [dailyDaysInput, setDailyDaysInput] = useState('30');
      const [customDailyTarget, setCustomDailyTarget] = useState(() => {
        return localStorage.getItem('kavach_custom_daily_target') || '';
      });
      const [availableSavings, setAvailableSavings] = useState(0);
      const [lockedSavings, setLockedSavings] = useState(0);
      const [title, setTitle] = useState('');
      const [target, setTarget] = useState('');
      const [saved, setSaved] = useState('');
      const [deadline, setDeadline] = useState('');
      const [submitting, setSubmitting] = useState(false);

      const fetchGoals = async () => {
        try {
          const token = localStorage.getItem('kavach_token');
          const [goalsRes, sumRes] = await Promise.all([
            fetch('/api/goals/', { headers: token ? { 'Authorization': `Bearer ${token}` } : {} }),
            fetch('/api/dashboard/summary', { headers: token ? { 'Authorization': `Bearer ${token}` } : {} })
          ]);

          if (sumRes.ok) {
            const sumData = await sumRes.json();
            setAvailableSavings(Number(sumData.general_available_savings ?? sumData.net_balance ?? 0));
            setLockedSavings(Number(sumData.locked_goal_savings ?? sumData.total_goal_deposits ?? 0));
          }

          if (goalsRes.ok) {
            const data = await goalsRes.json();
            setGoals(data.map(g => {
              const targetAmt = Number(g.target_amount || g.target || 1);
              const currentAmt = Number(g.current_amount || g.saved || 0);
              const remaining = Math.max(0, targetAmt - currentAmt);
              const daysRemaining = g.days_remaining !== undefined && g.days_remaining !== null
                ? Number(g.days_remaining)
                : (g.target_date ? Math.max(0, Math.ceil((new Date(g.target_date) - new Date()) / (1000 * 60 * 60 * 24))) : null);
              const dailyTarget = g.daily_target !== undefined && g.daily_target !== null
                ? Number(g.daily_target)
                : (daysRemaining && daysRemaining > 0 ? Math.round(remaining / daysRemaining) : (daysRemaining === 0 ? remaining : 0));
              const savedToday = Number(g.saved_today || 0);
              const isDailyMet = Boolean(g.is_daily_target_met ?? (dailyTarget > 0 && savedToday >= dailyTarget));

              return {
                id: g.id,
                title: g.title,
                target: targetAmt,
                saved: currentAmt,
                remaining: remaining,
                deadline: g.target_date || '',
                days: daysRemaining,
                daily_target: dailyTarget,
                saved_today: savedToday,
                is_daily_target_met: isDailyMet,
                icon: '🎯'
              };
            }));
          }
        } catch (e) {
          console.error('Error loading goals from database:', e);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchGoals();
      }, []);

      const handleDeposit = async (id, amt) => {
        const numAmt = Number(amt);
        if (!numAmt || numAmt <= 0) return;
        if (numAmt > availableSavings) {
          alert(`Insufficient available money! You currently have ₹${availableSavings.toLocaleString('en-IN')} available. Adding ₹${numAmt.toLocaleString('en-IN')} exceeds your liquid spendable funds.`);
          return;
        }

        try {
          const token = localStorage.getItem('kavach_token');
          // Optimistically deduct from available balance right away
          setAvailableSavings(prev => Math.max(0, prev - numAmt));
          setLockedSavings(prev => prev + numAmt);

          const res = await fetch(`/api/goals/${id}/deposit`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              ...(token ? { 'Authorization': `Bearer ${token}` } : {})
            },
            body: JSON.stringify({ amount: numAmt })
          });
          if (res.ok) {
            fetchGoals();
          } else {
            const errData = await res.json().catch(() => ({}));
            alert(errData.detail || 'Deposit failed');
            fetchGoals();
          }
        } catch (e) {
          console.error('Deposit error:', e);
          fetchGoals();
        }
      };

      const handleCustomDeposit = (id) => {
        const amt = Number(customAmounts[id]);
        if (!amt || amt <= 0) return;
        handleDeposit(id, amt);
        setCustomAmounts(prev => ({ ...prev, [id]: '' }));
      };

      const handleAdd = async (e) => {
        e.preventDefault();
        const isDaily = goalMode === 'daily';
        const finalTitle = isDaily ? (title.trim() || `Daily Savings Habit (₹${dailyAmtInput}/day)`) : title.trim();
        const finalTarget = isDaily ? ((Number(dailyAmtInput) || 0) * (Number(dailyDaysInput) || 30)) : Number(target);
        const finalDeadline = isDaily ? (new Date(Date.now() + (Number(dailyDaysInput) || 30) * 86400000).toISOString().split('T')[0]) : (deadline || null);
        const initialDep = Number(saved) || 0;

        if (!finalTitle || !finalTarget) return;
        if (initialDep > 0 && initialDep > availableSavings) {
          alert(`Insufficient available money! You currently have ₹${availableSavings.toLocaleString('en-IN')} available, but requested an initial deposit of ₹${initialDep.toLocaleString('en-IN')}.`);
          return;
        }

        setSubmitting(true);
        try {
          const token = localStorage.getItem('kavach_token');
          const res = await fetch('/api/goals/', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              ...(token ? { 'Authorization': `Bearer ${token}` } : {})
            },
            body: JSON.stringify({
              title: finalTitle,
              target_amount: finalTarget,
              category: isDaily ? 'Daily Habit' : 'General',
              target_date: finalDeadline,
              initial_deposit: initialDep
            })
          });
          if (res.ok) {
            setIsModalOpen(false);
            setTitle(''); setTarget(''); setSaved(''); setDeadline('');
            setGoalMode('purchase');
            fetchGoals();
          }
        } catch (err) {
          console.error('Error creating goal in database:', err);
        } finally {
          setSubmitting(false);
        }
      };

      return (
        <div className="w-full max-w-6xl mx-auto space-y-6 animate-fade-in text-left">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-4 border-b border-slate-200/80 dark:border-slate-800">
            <div>
              <div className="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-emerald-50 dark:bg-emerald-950/50 border border-emerald-200 dark:border-emerald-900/60 text-emerald-700 dark:text-emerald-300 text-[11px] font-semibold uppercase tracking-wider mb-1.5">
                <IconSparkles className="w-3.5 h-3.5" />
                <span>Daily Savings & Goals Planner</span>
              </div>
              <h1 className="text-2xl sm:text-3xl font-bold text-slate-900 dark:text-white tracking-tight">Personal Savings Goals</h1>
              <p className="text-xs sm:text-sm text-slate-500 dark:text-slate-400">Set daily savings habits, track milestones, and fund major buys live.</p>
            </div>
            <div className="flex items-center gap-2 self-start sm:self-auto">
              <button
                onClick={() => {
                  setGoalMode('daily');
                  setIsModalOpen(true);
                }}
                className="min-h-[42px] px-3.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-xs sm:text-sm flex items-center gap-1.5 cursor-pointer shadow-xs transition-all active:scale-95"
              >
                <span>⚡ Make Daily Goal</span>
              </button>
              <button
                onClick={() => {
                  setGoalMode('purchase');
                  setIsModalOpen(true);
                }}
                className="min-h-[42px] px-4 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-semibold text-xs sm:text-sm flex items-center gap-1.5 cursor-pointer shadow-xs transition-all active:scale-95"
              >
                <IconPlus className="w-4 h-4 text-amber-300" />
                <span>Add New Goal</span>
              </button>
            </div>
          </div>

          {/* ========================================================= */}
          {/* AVAILABLE LIQUID MONEY VS LOCKED IN GOALS BANNER          */}
          {/* ========================================================= */}
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3.5 sm:gap-4">
            <div className="bg-white dark:bg-slate-900 p-4 sm:p-5 rounded-2xl border border-slate-200/90 dark:border-slate-800 shadow-xs flex items-center justify-between">
              <div className="flex items-center gap-3.5">
                <div className="w-11 h-11 rounded-xl bg-emerald-50 dark:bg-emerald-950/50 text-emerald-600 dark:text-emerald-400 flex items-center justify-center shrink-0">
                  <IconWallet className="w-5 h-5" />
                </div>
                <div>
                  <span className="text-[11px] font-semibold text-slate-400 dark:text-slate-500 uppercase tracking-wider block mb-0.5">Total Available Money (Spendable)</span>
                  <span className="text-xl sm:text-2xl font-bold text-slate-900 dark:text-white block tracking-tight">
                    ₹{availableSavings.toLocaleString('en-IN')}
                  </span>
                  <span className="text-[11px] text-emerald-600 dark:text-emerald-400 font-medium block">
                    Available in your liquid pool
                  </span>
                </div>
              </div>
              <span className="text-xs font-semibold px-2.5 py-1 rounded-full bg-emerald-50 dark:bg-emerald-950/50 text-emerald-700 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800">
                Spendable
              </span>
            </div>

            <div className="bg-white dark:bg-slate-900 p-4 sm:p-5 rounded-2xl border border-slate-200/90 dark:border-slate-800 shadow-xs flex items-center justify-between">
              <div className="flex items-center gap-3.5">
                <div className="w-11 h-11 rounded-xl bg-amber-50 dark:bg-amber-950/50 text-amber-600 dark:text-amber-400 flex items-center justify-center shrink-0">
                  <IconSparkles className="w-5 h-5" />
                </div>
                <div>
                  <span className="text-[11px] font-semibold text-slate-400 dark:text-slate-500 uppercase tracking-wider block mb-0.5">Locked in Personal Goals</span>
                  <span className="text-xl sm:text-2xl font-bold text-amber-600 dark:text-amber-400 block tracking-tight">
                    ₹{lockedSavings.toLocaleString('en-IN')}
                  </span>
                  <span className="text-[11px] text-amber-600 dark:text-amber-400 font-medium block">
                    Deducted from spendable balance
                  </span>
                </div>
              </div>
              <span className="text-xs font-semibold px-2.5 py-1 rounded-full bg-amber-50 dark:bg-amber-950/50 text-amber-700 dark:text-amber-300 border border-amber-200 dark:border-amber-800">
                Lockbox
              </span>
            </div>
          </div>

          {/* ========================================================= */}
          {/* TODAY'S DAILY GOAL & ACHIEVEMENT TRACKER HERO CARD        */}
          {/* ========================================================= */}
          {(() => {
            const sumGoalDailyTargets = goals.reduce((acc, g) => acc + (Number(g.daily_target) || 0), 0);
            const activeDailyTarget = customDailyTarget ? Number(customDailyTarget) : sumGoalDailyTargets;
            const totalSavedToday = goals.reduce((acc, g) => acc + (Number(g.saved_today) || 0), 0);
            const isGoalAchieved = activeDailyTarget > 0 && totalSavedToday >= activeDailyTarget;
            const progressPercent = activeDailyTarget > 0 ? Math.min(100, Math.round((totalSavedToday / activeDailyTarget) * 100)) : 0;
            const remainingToSaveToday = Math.max(0, activeDailyTarget - totalSavedToday);

            // Streak tracker
            let streak = Number(localStorage.getItem('kavach_daily_streak') || 3);
            if (isGoalAchieved) {
              const lastAchievedDate = localStorage.getItem('kavach_last_achieved_date');
              const todayStr = new Date().toISOString().split('T')[0];
              if (lastAchievedDate !== todayStr) {
                localStorage.setItem('kavach_last_achieved_date', todayStr);
                streak = streak + 1;
                localStorage.setItem('kavach_daily_streak', streak);
              }
            }

            return (
              <div className={`p-5 sm:p-6 rounded-3xl border transition-all ${
                isGoalAchieved
                  ? 'bg-gradient-to-br from-emerald-50 via-emerald-100/40 to-white dark:from-emerald-950/40 dark:via-slate-900 dark:to-slate-900 border-emerald-300 dark:border-emerald-700/80 shadow-md'
                  : 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-800 shadow-xs'
              }`}>
                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
                  <div className="flex items-center gap-3">
                    <div className={`w-12 h-12 rounded-2xl flex items-center justify-center text-xl shadow-xs ${
                      isGoalAchieved ? 'bg-emerald-500 text-white' : 'bg-blue-50 dark:bg-blue-950/50 text-blue-600 dark:text-blue-400 border border-blue-200 dark:border-blue-900/60'
                    }`}>
                      {isGoalAchieved ? '🎉' : '🎯'}
                    </div>
                    <div>
                      <div className="flex items-center gap-2">
                        <span className="text-xs font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500">
                          Today's Daily Savings Goal
                        </span>
                        {isGoalAchieved ? (
                          <span className="inline-flex items-center gap-1 text-[11px] font-extrabold text-emerald-700 dark:text-emerald-300 bg-emerald-100 dark:bg-emerald-900/70 px-2.5 py-0.5 rounded-full border border-emerald-300 dark:border-emerald-700 animate-pulse">
                            <IconCheckCircle2 className="w-3.5 h-3.5" />
                            ACHIEVED TODAY!
                          </span>
                        ) : (
                          <span className="text-[11px] font-bold text-amber-600 dark:text-amber-400 bg-amber-50 dark:bg-amber-950/50 px-2 py-0.5 rounded-full border border-amber-200 dark:border-amber-800">
                            {progressPercent}% Achieved
                          </span>
                        )}
                      </div>
                      <h2 className="text-xl sm:text-2xl font-extrabold text-slate-900 dark:text-white tracking-tight mt-0.5">
                        ₹{totalSavedToday.toLocaleString('en-IN')} <span className="text-slate-400 dark:text-slate-500 text-base font-bold">/ ₹{activeDailyTarget.toLocaleString('en-IN')} today</span>
                      </h2>
                    </div>
                  </div>

                  <div className="flex items-center gap-2 self-start sm:self-auto">
                    <div className="px-3 py-1.5 bg-amber-50 dark:bg-amber-950/40 border border-amber-200 dark:border-amber-800/60 rounded-xl flex items-center gap-1.5 text-xs font-extrabold text-amber-700 dark:text-amber-300">
                      <IconFlame className="w-4 h-4 text-amber-500" />
                      <span>{streak} Day Streak</span>
                    </div>
                    <button
                      type="button"
                      onClick={() => {
                        setGoalMode('daily');
                        setIsModalOpen(true);
                      }}
                      className="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 rounded-xl text-xs font-bold transition-all cursor-pointer flex items-center gap-1"
                    >
                      <IconPlus className="w-3.5 h-3.5" />
                      <span>Set Daily Goal</span>
                    </button>
                  </div>
                </div>

                {/* Progress Bar */}
                <div className="w-full h-3.5 bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden p-0.5 border border-slate-200 dark:border-slate-700 mb-3">
                  <div
                    className={`h-full rounded-full transition-all duration-700 ${
                      isGoalAchieved ? 'bg-emerald-500' : 'bg-gradient-to-r from-blue-500 to-amber-500'
                    }`}
                    style={{ width: `${progressPercent}%` }}
                  />
                </div>

                {/* Subtext info and quick save action */}
                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 text-xs">
                  <div className="text-slate-500 dark:text-slate-400 font-medium">
                    {isGoalAchieved ? (
                      <span className="text-emerald-700 dark:text-emerald-400 font-bold flex items-center gap-1">
                        <IconCheckCircle2 className="w-4 h-4 text-emerald-600" />
                        Boom! You've achieved your daily savings target for today. Keep up the streak tomorrow!
                      </span>
                    ) : (
                      <span>
                        {remainingToSaveToday > 0 ? (
                          <>Save <strong className="text-slate-800 dark:text-slate-200 font-bold">₹{remainingToSaveToday.toLocaleString('en-IN')}</strong> more today to lock in your daily achievement streak.</>
                        ) : (
                          'No daily goal target set yet. Create a daily habit goal to track daily savings.'
                        )}
                      </span>
                    )}
                  </div>

                  {!isGoalAchieved && remainingToSaveToday > 0 && goals.length > 0 && (
                    <button
                      type="button"
                      onClick={() => handleDeposit(goals[0].id, remainingToSaveToday)}
                      className="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold text-xs shadow-xs cursor-pointer transition-all active:scale-95 flex items-center gap-1.5 self-start sm:self-auto shrink-0"
                    >
                      <span>⚡ Save ₹{remainingToSaveToday.toLocaleString('en-IN')} to Hit Goal</span>
                      <IconArrowRight className="w-3 h-3 text-amber-300" />
                    </button>
                  )}
                </div>
              </div>
            );
          })()}

          {goals.length === 0 ? (
            <div className="py-16 bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 text-center p-6 space-y-3">
              <div className="w-12 h-12 rounded-2xl bg-slate-100 dark:bg-slate-800 text-slate-400 flex items-center justify-center mx-auto">
                <IconTarget className="w-6 h-6" />
              </div>
              <h3 className="text-lg font-bold text-slate-800 dark:text-slate-200">No savings goals in database</h3>
              <p className="text-xs text-slate-400 max-w-sm mx-auto">
                New accounts start clean with zero mock goals. Set up a target like a laptop, camera, or emergency cushion to begin saving!
              </p>
              <button
                type="button"
                onClick={() => setIsModalOpen(true)}
                className="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold text-xs rounded-xl shadow-xs cursor-pointer transition-all"
              >
                Create Your First Goal
              </button>
            </div>
          ) : (
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4 sm:gap-5">
              {goals.map(g => {
                const p = Math.min(100, Math.round((g.saved / g.target) * 100));
                const isDone = g.saved >= g.target;
                return (
                  <div key={g.id} className="bg-white dark:bg-slate-900 p-5 rounded-2xl border border-slate-200/90 dark:border-slate-800 shadow-xs hover:border-slate-300 dark:hover:border-slate-700 transition-all text-left">
                    <div className="flex items-start justify-between gap-3 mb-2">
                      <div className="flex items-center gap-2.5">
                        <span className="text-2xl">{g.icon}</span>
                        <div>
                          <h3 className="text-base font-bold text-slate-900 dark:text-white leading-snug">{g.title}</h3>
                          <span className="text-xs text-slate-400">
                            {g.deadline ? `Target: ${g.deadline}` : 'Open Deadline'} {g.days !== null ? `• ${g.days} days left` : ''}
                          </span>
                        </div>
                      </div>
                      <span className={`text-xs font-bold px-2.5 py-1 rounded-full ${
                        isDone ? 'bg-emerald-100 dark:bg-emerald-950/60 text-emerald-700 dark:text-emerald-300' : 'bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300'
                      }`}>
                        {p}%
                      </span>
                    </div>

                    <div className="space-y-1.5 my-3">
                      <div className="flex justify-between text-xs font-semibold">
                        <span className="text-slate-500 dark:text-slate-400">₹{g.saved.toLocaleString('en-IN')} saved</span>
                        <span className="text-slate-900 dark:text-white">Target: ₹{g.target.toLocaleString('en-IN')}</span>
                      </div>
                      <div className="w-full h-2.5 bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden">
                        <div className={`h-full rounded-full transition-all duration-300 ${isDone ? 'bg-emerald-500' : 'bg-blue-600'}`} style={{ width: `${p}%` }} />
                      </div>
                    </div>

                    {/* --- DAILY SAVINGS SUGGESTION & TRACKER --- */}
                    {(() => {
                      const dailyTarget = Number(g.daily_target || 0);
                      const savedToday = Number(g.saved_today || 0);
                      const isDailyMet = Boolean(g.is_daily_target_met || (dailyTarget > 0 && savedToday >= dailyTarget));
                      const dailyPercent = dailyTarget > 0 ? Math.min(100, Math.round((savedToday / dailyTarget) * 100)) : 0;

                      return (
                        <div className={`my-3 p-3 rounded-xl border transition-all ${
                          isDailyMet
                            ? 'bg-emerald-50/90 dark:bg-emerald-950/40 border-emerald-300 dark:border-emerald-800/80 shadow-xs'
                            : 'bg-slate-50 dark:bg-slate-800/60 border-slate-200/80 dark:border-slate-700/80'
                        }`}>
                          <div className="flex items-center justify-between mb-2">
                            <div className="flex items-center gap-1.5">
                              <span className="text-sm">🎯</span>
                              <span className="text-xs font-bold text-slate-800 dark:text-slate-200">
                                Daily Target:{' '}
                                <span className={isDailyMet ? 'text-emerald-700 dark:text-emerald-400 font-extrabold' : 'text-slate-900 dark:text-white font-extrabold'}>
                                  {dailyTarget > 0 ? `₹${Math.round(dailyTarget).toLocaleString('en-IN')}` : '—'}
                                </span>
                              </span>
                            </div>

                            {isDailyMet && dailyTarget > 0 ? (
                              <span className="inline-flex items-center gap-1 text-[11px] font-bold text-emerald-800 dark:text-emerald-300 bg-emerald-100 dark:bg-emerald-900/60 px-2 py-0.5 rounded-full border border-emerald-300 dark:border-emerald-700">
                                <IconCheckCircle2 className="w-3.5 h-3.5 text-emerald-600 dark:text-emerald-400" />
                                Target Met!
                              </span>

              dateLabel: t.date,
              amount: Number(t.amount),
              type: (t.type || 'EXPENSE').toLowerCase(),

          console.error('Error fetching transactions from database:', e);

          setLoading(false);

        localStorage.removeItem('kavach_transactions');

            body: JSON.stringify({
              amount: enteredAmount,
              type: formType.toUpperCase(),
              category: formCategory,
              description: formTitle.trim(),
              payment_method: formMode,
              date: formDate
            })
          });

          if (res.ok) {
            const data = await res.json();
            setIsModalOpen(false);
            setFormTitle('');
            setFormAmount('');
            fetchTransactions();

            if (isIncomeTxn) {
              const allocResult = data?.allocation_result || {
                income_amount: enteredAmount,
                allocations: {
                  "Food & Dining": Math.round(enteredAmount * 0.25),
                  "Bills & Utilities": Math.round(enteredAmount * 0.15),
                  "Commute & Travel": Math.round(enteredAmount * 0.10),
                  "Shopping & Tech": Math.round(enteredAmount * 0.15),
                  "Social & Entertainment": Math.round(enteredAmount * 0.15),
                  "Savings & Investments": Math.round(enteredAmount * 0.20),
                },
                deposited_goal: data?.allocation_result?.deposited_goal || null
              };
              setAllocationSuccess(allocResult);
            }
          }
        } catch (err) {
          console.error('Error creating transaction in database:', err);
        } finally {
          setSubmitting(false);
        }
      };

      const handleDelete = async (id) => {
        try {
          const token = localStorage.getItem('kavach_token');
          const res = await fetch(`/api/transactions/${id}`, {
            method: 'DELETE',
            headers: token ? { 'Authorization': `Bearer ${token}` } : {}
          });
          if (res.ok) {
            setTransactions(transactions.filter(t => t.id !== id));
          }
        } catch (err) {
          console.error('Delete error:', err);
        }
      };

      const totalIncome = transactions
        .filter((t) => t.type === 'income')
        .reduce((sum, t) => sum + t.amount, 0);

      const totalExpense = transactions
        .filter((t) => t.type === 'expense')
        .reduce((sum, t) => sum + t.amount, 0);

      const totalGoalTransfers = transactions
        .filter((t) => t.type === 'goal_transfer')
        .reduce((sum, t) => sum + t.amount, 0);

      const netBalance = totalIncome - totalExpense - totalGoalTransfers;

      const todayStr = new Date().toISOString().split('T')[0];
      const todayExpense = transactions
        .filter((t) => t.type === 'expense' && t.date === todayStr)
        .reduce((sum, t) => sum + t.amount, 0);

      const dailyCap = 500;
      const isOverDailyCap = todayExpense > dailyCap;

      const filteredList = transactions.filter((t) => {
        if (filter === 'all') return true;
        return t.type === filter;
      });

      const groupedTransactions = filteredList.reduce((acc, txn) => {
        const key = txn.dateLabel || txn.date || 'Recent';
        if (!acc[key]) acc[key] = [];
        acc[key].push(txn);
        return acc;
      }, {});

      return (
        <div className="flex flex-col animate-fade-in text-left space-y-6 w-full max-w-6xl mx-auto">
          {/* Header */}
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-4 border-b border-slate-200/80 dark:border-slate-800">
            <div>
              <div className="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-blue-50 dark:bg-blue-950/50 border border-blue-200 dark:border-blue-900/60 text-blue-700 dark:text-blue-300 text-[11px] font-semibold uppercase tracking-wider mb-1.5">
                <IconWallet className="w-3.5 h-3.5" />
                <span>Live Database Ledger</span>
              </div>
              <h1 className="text-2xl sm:text-3xl font-bold text-slate-900 dark:text-white tracking-tight">Daily Cashflow Ledger</h1>
              <p className="text-xs sm:text-sm text-slate-500 dark:text-slate-400">All records fetched live from your database account.</p>
            </div>
            
            <button
              type="button"
              onClick={() => setIsModalOpen(true)}
              className="min-h-[42px] px-4 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-semibold text-xs sm:text-sm flex items-center gap-1.5 cursor-pointer shadow-xs transition-all active:scale-95 self-start sm:self-auto"
            >
              <IconPlus className="w-4 h-4 text-amber-300" />
              <span>Log Transaction</span>
            </button>
          </div>

          {/* Metric Summary Cards */}
          <div className="grid grid-cols-2 lg:grid-cols-4 gap-3.5 sm:gap-4">
            <div className="bg-white dark:bg-slate-900 p-4 sm:p-5 rounded-2xl border border-slate-200/90 dark:border-slate-800 shadow-xs">
              <span className="text-[11px] font-semibold text-slate-400 dark:text-slate-500 uppercase tracking-wider block mb-1">Total Inflow</span>
              <span className="text-xl sm:text-2xl font-bold text-slate-900 dark:text-white block tracking-tight">₹{totalIncome.toLocaleString('en-IN')}</span>
              <span className="text-[11px] text-emerald-600 dark:text-emerald-400 font-semibold block mt-1">Recorded Incomes</span>
            </div>

            <div className="bg-white dark:bg-slate-900 p-4 sm:p-5 rounded-2xl border border-slate-200/90 dark:border-slate-800 shadow-xs">
              <span className="text-[11px] font-semibold text-slate-400 dark:text-slate-500 uppercase tracking-wider block mb-1">Total Spent</span>
              <span className="text-xl sm:text-2xl font-bold text-slate-900 dark:text-white block tracking-tight">₹{totalExpense.toLocaleString('en-IN')}</span>
              <span className="text-[11px] text-slate-500 dark:text-slate-400 font-medium block mt-1">Recorded Expenditures</span>
            </div>

            <div className="bg-white dark:bg-slate-900 p-4 sm:p-5 rounded-2xl border border-slate-200/90 dark:border-slate-800 shadow-xs">
              <span className="text-[11px] font-semibold text-slate-400 dark:text-slate-500 uppercase tracking-wider block mb-1">Locked in Goals</span>
              <span className="text-xl sm:text-2xl font-bold text-amber-600 dark:text-amber-400 block tracking-tight">₹{totalGoalTransfers.toLocaleString('en-IN')}</span>
              <span className="text-[11px] text-amber-600 dark:text-amber-400 font-medium block mt-1">Transferred into Goals</span>
            </div>

            <div className="bg-white dark:bg-slate-900 p-4 sm:p-5 rounded-2xl border border-slate-200/90 dark:border-slate-800 shadow-xs">
              <span className="text-[11px] font-semibold text-slate-400 dark:text-slate-500 uppercase tracking-wider block mb-1">Liquid Balance</span>
              <span className={`text-xl sm:text-2xl font-bold block tracking-tight ${netBalance >= 0 ? 'text-emerald-600 dark:text-emerald-400' : 'text-rose-600 dark:text-rose-400'}`}>
                ₹{netBalance.toLocaleString('en-IN')}
              </span>
              <span className="text-[11px] text-slate-500 dark:text-slate-400 font-medium block mt-1">
                {netBalance >= 0 ? 'Spendable after goals' : 'Current deficit'}
              </span>
            </div>
          </div>

          {/* Filter Tabs */}
          <div className="flex items-center justify-between gap-3 pt-2">
            <div className="inline-flex p-1 bg-slate-100 dark:bg-slate-800/80 rounded-xl border border-slate-200/80 dark:border-slate-700/80">
              <button
                type="button"
                onClick={() => setFilter('all')}
                className={`min-h-[34px] px-3 text-xs font-semibold rounded-lg transition-all cursor-pointer ${
                  filter === 'all'
                    ? 'bg-white dark:bg-slate-900 text-slate-900 dark:text-white shadow-xs font-bold'
                    : 'text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-white'
                }`}
              >
                All Activity ({transactions.length})
              </button>
              <button
                type="button"
                onClick={() => setFilter('expense')}
                className={`min-h-[34px] px-3 text-xs font-semibold rounded-lg transition-all cursor-pointer ${
                  filter === 'expense'
                    ? 'bg-white dark:bg-slate-900 text-rose-600 dark:text-rose-400 shadow-xs font-bold'
                    : 'text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-white'
                }`}
              >
                Expenses Only
              </button>
              <button
                type="button"
                onClick={() => setFilter('income')}
                className={`min-h-[34px] px-3 text-xs font-semibold rounded-lg transition-all cursor-pointer ${
                  filter === 'income'
                    ? 'bg-white dark:bg-slate-900 text-emerald-600 dark:text-emerald-400 shadow-xs font-bold'
                    : 'text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-white'
                }`}
              >
                Incomes Only
              </button>
              <button
                type="button"
                onClick={() => setFilter('goal_transfer')}
                className={`min-h-[34px] px-3 text-xs font-semibold rounded-lg transition-all cursor-pointer ${
                  filter === 'goal_transfer'
                    ? 'bg-white dark:bg-slate-900 text-amber-600 dark:text-amber-400 shadow-xs font-bold'
                    : 'text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-white'
                }`}
              >
                Goal Transfers
              </button>
            </div>
          </div>

          {/* Transaction groups */}
          <div className="space-y-4">
            {Object.keys(groupedTransactions).length === 0 ? (
              <div className="bg-white dark:bg-slate-900 rounded-2xl p-12 border border-slate-200/90 dark:border-slate-800 text-center text-slate-400 space-y-3">
                <div className="w-12 h-12 rounded-2xl bg-slate-100 dark:bg-slate-800 text-slate-400 flex items-center justify-center mx-auto">
                  <IconWallet className="w-6 h-6" />
                </div>
                <p className="text-base font-bold text-slate-700 dark:text-slate-300">No transactions recorded in database</p>
                <p className="text-xs text-slate-400 max-w-sm mx-auto">
                  New accounts start clean. Click below to log your first income or UPI expense!
                </p>
                <button
                  type="button"
                  onClick={() => setIsModalOpen(true)}
                  className="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold text-xs rounded-xl shadow-xs cursor-pointer transition-all"
                >
                  Log First Transaction
                </button>
              </div>
            ) : (
              Object.keys(groupedTransactions).map((dayGroup) => (
                <div key={dayGroup} className="space-y-2">
                  <div className="flex items-center justify-between px-1">
                    <span className="text-xs font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500">
                      {dayGroup}
                    </span>
                    <span className="text-xs font-medium text-slate-400">
                      {groupedTransactions[dayGroup].length} transaction{groupedTransactions[dayGroup].length > 1 ? 's' : ''}
                    </span>
                  </div>

                  <div className="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200/90 dark:border-slate-800 divide-y divide-slate-100 dark:divide-slate-800 shadow-xs overflow-hidden">
                    {groupedTransactions[dayGroup].map((t) => (
                      <div
                        key={t.id}
                        className="p-4 sm:px-5 flex items-center justify-between gap-3 hover:bg-slate-50/50 dark:hover:bg-slate-800/40 transition-colors group"
                      >
                        <div className="flex items-center gap-3.5">
                          <div className={`w-10 h-10 rounded-xl flex items-center justify-center shrink-0 ${
                            t.type === 'income'
                              ? 'bg-emerald-50 dark:bg-emerald-950/50 text-emerald-600'
                              : t.type === 'goal_transfer'
                              ? 'bg-amber-50 dark:bg-amber-950/50 text-amber-600'
                              : 'bg-rose-50 dark:bg-rose-950/50 text-rose-600'
                          }`}>
                            {t.type === 'goal_transfer' ? <IconSparkles className="w-5 h-5" /> : <IconWallet className="w-5 h-5" />}
                          </div>
                          <div>
                            <h4 className="text-sm font-bold text-slate-900 dark:text-white leading-tight">{t.title}</h4>
                            <p className="text-xs text-slate-400 mt-0.5">{t.category} • {t.mode}</p>
                          </div>
                        </div>

                        <div className="flex items-center gap-3">
                          <span className={`text-sm sm:text-base font-bold ${
                            t.type === 'income'
                              ? 'text-emerald-600 dark:text-emerald-400'
                              : t.type === 'goal_transfer'
                              ? 'text-amber-600 dark:text-amber-400'
                              : 'text-slate-900 dark:text-white'
                          }`}>
                            {t.type === 'income' ? '+' : '-'}₹{t.amount.toLocaleString('en-IN')}
                          </span>
                          <button
                            type="button"
                            onClick={() => handleDelete(t.id)}
                            className="text-slate-300 hover:text-rose-500 p-1 opacity-0 group-hover:opacity-100 transition-opacity cursor-pointer"
                            title="Delete transaction"
                          >
                            <IconTrash2 className="w-4 h-4" />
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              ))
            )}
          </div>

          {/* Modal to log new transaction */}
          {isModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/50 backdrop-blur-xs animate-fade-in">
              <div className="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-2xl p-6 sm:p-7 w-full max-w-md relative text-left">
                <button
                  type="button"
                  onClick={() => setIsModalOpen(false)}
                  className="absolute top-4 right-4 text-slate-400 hover:text-slate-600"
                >
                  <IconX className="w-5 h-5" />
                </button>

                <h3 className="text-xl font-bold text-slate-900 dark:text-white mb-1">Log Transaction</h3>
                <p className="text-xs text-slate-400 mb-4">Record new income or expense to your database ledger.</p>

                <form onSubmit={handleAddTransaction} className="space-y-3.5">
                  {/* Type switcher */}
                  <div className="grid grid-cols-2 p-1 bg-slate-100 dark:bg-slate-800 rounded-xl">
                    <button
                      type="button"
                      onClick={() => { setFormType('expense'); setFormCategory('Food & Dining'); }}
                      className={`py-1.5 text-xs font-bold rounded-lg transition-all ${
                        formType === 'expense' ? 'bg-white dark:bg-slate-700 text-rose-600 shadow-xs' : 'text-slate-400'
                      }`}
                    >
                      Expense (-)
                    </button>
                    <button
                      type="button"
                      onClick={() => { setFormType('income'); setFormCategory('Stipend'); }}
                      className={`py-1.5 text-xs font-bold rounded-lg transition-all ${
                        formType === 'income' ? 'bg-white dark:bg-slate-700 text-emerald-600 shadow-xs' : 'text-slate-400'
                      }`}
                    >
                      Income (+)
                    </button>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Amount (₹)</label>
                    <input
                      type="number"
                      min="1"
                      required
                      value={formAmount}
                      onChange={e => setFormAmount(e.target.value)}
                      placeholder="e.g. 350"
                      className="w-full min-h-[44px] px-3.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm font-bold text-slate-900 dark:text-white outline-none focus:border-blue-600"
                    />
                  </div>

                  {formType === 'income' && Number(formAmount) > 0 && (
                    <div className="p-3 bg-blue-50/80 dark:bg-blue-950/40 border border-blue-200 dark:border-blue-900/50 rounded-xl space-y-1.5 text-left">
                      <div className="flex items-center justify-between text-[11px]">
                        <span className="font-bold text-blue-900 dark:text-blue-300">
                          ⚡ 50/30/20 Auto-Allocation Preview
                        </span>
                        <span className="text-[10px] font-semibold text-blue-700 dark:text-blue-400 bg-blue-100 dark:bg-blue-900/60 px-1.5 py-0.5 rounded">
                          Automatic
                        </span>
                      </div>
                      <div className="grid grid-cols-2 sm:grid-cols-3 gap-1.5 text-[10px]">
                        <div className="bg-white dark:bg-slate-800 p-1.5 rounded-lg border border-slate-200 dark:border-slate-700">
                          <span className="text-slate-500 dark:text-slate-400 block">🍽️ Food (25%)</span>
                          <span className="font-bold text-slate-800 dark:text-slate-200">₹{Math.round(Number(formAmount) * 0.25).toLocaleString('en-IN')}</span>
                        </div>
                        <div className="bg-white dark:bg-slate-800 p-1.5 rounded-lg border border-slate-200 dark:border-slate-700">
                          <span className="text-slate-500 dark:text-slate-400 block">💡 Bills (15%)</span>
                          <span className="font-bold text-slate-800 dark:text-slate-200">₹{Math.round(Number(formAmount) * 0.15).toLocaleString('en-IN')}</span>
                        </div>
                        <div className="bg-white dark:bg-slate-800 p-1.5 rounded-lg border border-slate-200 dark:border-slate-700">
                          <span className="text-slate-500 dark:text-slate-400 block">🚌 Travel (10%)</span>
                          <span className="font-bold text-slate-800 dark:text-slate-200">₹{Math.round(Number(formAmount) * 0.10).toLocaleString('en-IN')}</span>
                        </div>
                        <div className="bg-white dark:bg-slate-800 p-1.5 rounded-lg border border-slate-200 dark:border-slate-700">
                          <span className="text-slate-500 dark:text-slate-400 block">🛍️ Shop (15%)</span>
                          <span className="font-bold text-slate-800 dark:text-slate-200">₹{Math.round(Number(formAmount) * 0.15).toLocaleString('en-IN')}</span>
                        </div>
                        <div className="bg-white dark:bg-slate-800 p-1.5 rounded-lg border border-slate-200 dark:border-slate-700">
                          <span className="text-slate-500 dark:text-slate-400 block">🎬 Social (15%)</span>
                          <span className="font-bold text-slate-800 dark:text-slate-200">₹{Math.round(Number(formAmount) * 0.15).toLocaleString('en-IN')}</span>
                        </div>
                        <div className="bg-emerald-50 dark:bg-emerald-950/50 p-1.5 rounded-lg border border-emerald-200 dark:border-emerald-800">
                          <span className="text-emerald-700 dark:text-emerald-400 font-semibold block">💎 Savings (20%)</span>
                          <span className="font-black text-emerald-800 dark:text-emerald-300">₹{Math.round(Number(formAmount) * 0.20).toLocaleString('en-IN')}</span>
                        </div>
                      </div>
                      <p className="text-[10px] text-slate-500 dark:text-slate-400">
                        20% will be transferred to your active savings goal automatically.
                      </p>
                    </div>
                  )}

                  <div>
                    <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Description</label>
                    <input
                      type="text"
                      required
                      value={formTitle}
                      onChange={e => setFormTitle(e.target.value)}
                      placeholder="e.g. Swiggy food or Freelance payout"
                      className="w-full min-h-[44px] px-3.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm text-slate-900 dark:text-white outline-none focus:border-blue-600"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Category</label>
                    <select
                      value={formCategory}
                      onChange={e => setFormCategory(e.target.value)}
                      className="w-full min-h-[44px] px-3.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm text-slate-900 dark:text-white outline-none focus:border-blue-600"
                    >
                      {(formType === 'expense' ? expenseCategories : incomeCategories).map(cat => (
                        <option key={cat} value={cat}>{cat}</option>
                      ))}
                    </select>
                  </div>

                  <div className="grid grid-cols-2 gap-2.5">
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Date</label>
                      <input
                        type="date"
                        value={formDate}
                        onChange={e => setFormDate(e.target.value)}
                        className="w-full min-h-[44px] px-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs text-slate-900 dark:text-white outline-none focus:border-blue-600"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Payment Method</label>
                      <select
                        value={formMode}
                        onChange={e => setFormMode(e.target.value)}
                        className="w-full min-h-[44px] px-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs text-slate-900 dark:text-white outline-none focus:border-blue-600"
                      >
                        <option value="UPI">UPI</option>
                        <option value="Debit Card">Debit Card</option>
                        <option value="Net Banking">Net Banking</option>
                        <option value="Cash">Cash</option>
                      </select>
                    </div>
                  </div>

                  <button
                    type="submit"
                    disabled={submitting}
                    className="w-full min-h-[46px] rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm flex items-center justify-center gap-2 cursor-pointer shadow-sm shadow-blue-500/20 active:scale-[0.98] transition-all disabled:opacity-50 mt-4"
                  >
                    <span>{submitting ? 'Saving...' : (formType === 'income' ? 'Record Income & Auto-Allocate' : 'Log Expense (-)')}</span>
                    <IconCheckCircle2 className="w-4 h-4 text-amber-300" />
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* Celebratory Auto-Allocation Modal */}
          {allocationSuccess && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/50 backdrop-blur-xs animate-fade-in">
              <div className="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-2xl p-6 sm:p-7 w-full max-w-md relative text-center">
                <button
                  type="button"
                  onClick={() => setAllocationSuccess(null)}
                  className="absolute top-4 right-4 text-slate-400 hover:text-slate-600 cursor-pointer"
                >
                  <IconX className="w-5 h-5" />
                </button>

                <div className="w-12 h-12 mx-auto rounded-2xl bg-blue-50 dark:bg-blue-950/60 text-blue-600 dark:text-blue-400 flex items-center justify-center mb-3 text-xl">
                  ⚡
                </div>

                <h3 className="text-xl font-bold text-slate-900 dark:text-white">
                  Income Auto-Allocated!
                </h3>
                <p className="text-xs text-slate-500 dark:text-slate-400 mt-1 mb-4">
                  ₹{allocationSuccess.income_amount?.toLocaleString('en-IN')} has been distributed across envelopes (50/30/20 rule).
                </p>

                {allocationSuccess.deposited_goal ? (
                  <div className="p-3.5 bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800/60 rounded-2xl text-left mb-4 flex items-center gap-3">
                    <div className="w-10 h-10 rounded-xl bg-emerald-600 text-white flex items-center justify-center shrink-0 font-bold">
                      🎯
                    </div>
                    <div>
                      <span className="text-xs font-bold text-emerald-900 dark:text-emerald-300 block">
                        +₹{allocationSuccess.deposited_goal.deposited_amount?.toLocaleString('en-IN')} Locked into Goal!
                      </span>
                      <span className="text-[11px] text-emerald-700 dark:text-emerald-400 font-medium">
                        Transferred directly to <strong>{allocationSuccess.deposited_goal.title}</strong> ({allocationSuccess.deposited_goal.progress_percentage}% achieved)
                      </span>
                    </div>
                  </div>
                ) : (
                  <div className="p-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl text-xs text-slate-600 dark:text-slate-400 mb-4 text-left">
                    💎 20% (₹{allocationSuccess.allocations?.['Savings & Investments']?.toLocaleString('en-IN')}) saved to your available general savings.

                <p className="text-xs text-slate-600 dark:text-slate-400 leading-relaxed bg-slate-50 dark:bg-slate-800/60 p-3.5 rounded-xl border border-slate-200 dark:border-slate-700 mb-4">
                  {modalArticle.full}
                </p>
                <button
                  onClick={() => setModalArticle(null)}
                  className="w-full min-h-[42px] bg-blue-600 hover:bg-blue-700 text-white font-semibold text-xs rounded-xl cursor-pointer transition-all"
                >
                  Close Article
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // MAIN ROOT APP (With Hover-Slide Navigation & Theme Toggle)
    // ==========================================
    function App() {
      // User authentication state
      const [user, setUser] = useState(() => {
        try {
          const saved = localStorage.getItem('kavach_user');
          return saved ? JSON.parse(saved) : null;
        } catch(e) {
          return null;
        }
      });

      // Process and persist authenticated Supabase User
      const processSupabaseUser = (authUser) => {
        if (!authUser) return;
        const email = String(authUser.email || '');
        let rawName = 'MONEYCRAFT User';
        if (typeof authUser.user_metadata?.full_name === 'string' && authUser.user_metadata.full_name.trim()) {
          rawName = authUser.user_metadata.full_name.trim();
        } else if (typeof authUser.user_metadata?.name === 'string' && authUser.user_metadata.name.trim()) {
          rawName = authUser.user_metadata.name.trim();
        } else if (typeof authUser.user_metadata?.user_name === 'string' && authUser.user_metadata.user_name.trim()) {
          rawName = authUser.user_metadata.user_name.trim();
        } else if (email && email.includes('@')) {
          rawName = email.split('@')[0];
        }
        const name = String(rawName || 'MONEYCRAFT User');
        const phone = String(authUser.phone || authUser.user_metadata?.phone || '9876543210');
        const avatar = (authUser.user_metadata?.avatar_url && typeof authUser.user_metadata.avatar_url === 'string')
          ? authUser.user_metadata.avatar_url
          : (authUser.user_metadata?.picture && typeof authUser.user_metadata.picture === 'string')
          ? authUser.user_metadata.picture
          : null;

        // Defensive Sync: Run asynchronously without blocking navigation
        if (supabase) {
          try {
            supabase.from('users').upsert({
              id: authUser.id,
              email: email,
              name: name,
              monthly_income: 45000.0,
              monthly_budget_cap: 20000.0
            }, { onConflict: 'id' }).then(({ error }) => {
              if (error) console.warn('Defensive sync to public.users warning:', error);
            }).catch(err => {
              console.warn('Defensive sync error:', err);
            });
          } catch (err) {
            console.warn('Defensive sync caught error:', err);
          }
        }

        const kavachUser = {
          id: String(authUser.id || ''),
          name: name,
          email: email,
          phone: phone,
          avatar: avatar,
          persona: 'student',
          provider: authUser.app_metadata?.provider || 'google'
        };

        setUser(kavachUser);
        try {
          localStorage.setItem('kavach_user', JSON.stringify(kavachUser));
        } catch(e) {}

        // Clean up OAuth hash or search tokens from address bar
        if (window.location.hash.includes('access_token=') || window.location.search.includes('code=')) {
          window.history.replaceState(null, '', window.location.pathname + '#/dashboard');
        }

        navigate('/dashboard', kavachUser);
      };

      // Listen for Supabase OAuth redirect & auth state changes
      useEffect(() => {
        if (!supabase) return;

        let isMounted = true;

        const initAuth = async () => {
          // 1. Extract 'code' from search query OR hash query
          let code = new URLSearchParams(window.location.search).get('code');
          const rawHash = window.location.hash || '';
          if (!code && rawHash.includes('code=')) {
            const hashPart = rawHash.includes('?') ? rawHash.split('?')[1] : rawHash.replace(/^#\/?/, '');
            code = new URLSearchParams(hashPart).get('code');
          }

          if (code) {
            try {
              const { data, error } = await supabase.auth.exchangeCodeForSession(code);
              if (!error && data?.session?.user && isMounted) {
                processSupabaseUser(data.session.user);
                return;
              }
            } catch (err) {
              console.warn('PKCE exchangeCodeForSession notice:', err);
            }
          }

          // 2. Extract access_token & refresh_token from hash OR search
          if (rawHash.includes('access_token=') || window.location.search.includes('access_token=')) {
            try {
              const combined = (rawHash + '&' + window.location.search).replace(/^#\/?/, '');
              const params = new URLSearchParams(combined);
              const accessToken = params.get('access_token');
              const refreshToken = params.get('refresh_token');
              if (accessToken) {
                const { data, error } = await supabase.auth.setSession({
                  access_token: accessToken,
                  refresh_token: refreshToken || ''
                });
                if (!error && data?.session?.user && isMounted) {
                  processSupabaseUser(data.session.user);
                  return;
                }
              }
            } catch (err) {
              console.warn('Hash setSession notice:', err);
            }
          }

          // 3. Check for existing session
          try {
            const { data, error } = await supabase.auth.getSession();
            if (!error && data?.session?.user && isMounted) {
              processSupabaseUser(data.session.user);
              return;
            }
          } catch (err) {
            console.warn('Supabase getSession notice:', err);
          }
        };

        initAuth();

        // 4. Listen for OAuth callbacks (SIGNED_IN, INITIAL_SESSION) or SIGNED_OUT
        const { data: { subscription } } = supabase.auth.onAuthStateChange(async (event, session) => {
          if ((event === 'SIGNED_IN' || event === 'INITIAL_SESSION') && session?.user && isMounted) {
            processSupabaseUser(session.user);
          } else if (event === 'SIGNED_OUT' && isMounted) {
            setUser(null);
            try { localStorage.removeItem('kavach_user'); } catch(e) {}
          }
        });

        // 5. Timeout safety: if on /dashboard without user after 3.5s, return to /auth
        const timeoutId = setTimeout(() => {
          if (isMounted) {
            const saved = localStorage.getItem('kavach_user');
            if (!saved && (window.location.hash.includes('code=') || window.location.hash.includes('access_token=') || window.location.search.includes('code='))) {
              console.warn('OAuth session handover timed out, redirecting to /auth');
              window.history.replaceState(null, '', window.location.pathname + '#/auth');
              setRoute('/auth');
            }
          }
        }, 3500);

        return () => {
          isMounted = false;
          clearTimeout(timeoutId);
          subscription?.unsubscribe();
        };
      }, []);

      // Navigation drawer state & hover timeout
      const [isNavOpen, setIsNavOpen] = useState(false);
      const navTimeoutRef = useRef(null);

      // Theme state with localStorage persistence (default: light)
      const [theme, setTheme] = useState(() => {
        try {
          return localStorage.getItem('kavach_theme') || 'light';
        } catch (e) {
          return 'light';
        }
      });

      // Apply theme to document root
      useEffect(() => {
        try {
          localStorage.setItem('kavach_theme', theme);
        } catch (e) {}

        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
        }
      }, [theme]);

      // Route management
      const getRoute = () => {
        const rawHash = window.location.hash || '';
        // If this is an OAuth token or code callback, stay on or land on /dashboard
        if (rawHash.includes('access_token=') || rawHash.includes('refresh_token=') || window.location.search.includes('code=')) {
          return '/dashboard';
        }
        const h = rawHash.replace(/^#/, '') || '/';
        return h.startsWith('/') ? h : '/' + h;
      };

      const [route, setRoute] = useState(getRoute());

      useEffect(() => {
        const onHash = () => {
          const rawHash = window.location.hash || '';
          if (rawHash.includes('access_token=') || window.location.search.includes('code=')) {
            return;
          }
          const current = getRoute();
          if (!user && current !== '/' && current !== '/auth') {
            window.location.hash = '/auth';
            setRoute('/auth');
            return;
          }
          setRoute(current);
        };
        window.addEventListener('hashchange', onHash);
        return () => window.removeEventListener('hashchange', onHash);
      }, [user]);

      // Route guard effect
      useEffect(() => {
        const rawHash = window.location.hash || '';
        const rawSearch = window.location.search || '';
        // Never wipe URL during active OAuth callback processing
        if (rawHash.includes('access_token=') || rawSearch.includes('code=')) {
          return;
        }

        if (!user && route !== '/' && route !== '/auth') {
          window.location.hash = '/auth';
          setRoute('/auth');
        }
      }, [user, route]);

      const navigate = (p, currentUser = null) => {
        setIsNavOpen(false);
        const activeUser = currentUser !== null ? currentUser : user;
        if (!activeUser && p !== '/' && p !== '/auth') {
          window.location.hash = '/auth';
          setRoute('/auth');
          window.scrollTo({ top: 0, behavior: 'smooth' });
          return;
        }
        window.location.hash = p;
        setRoute(p);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const handleLogin = (u) => {
        setUser(u);
        try {
          localStorage.setItem('kavach_user', JSON.stringify(u));
        } catch(e) {}
        navigate('/dashboard', u);
      };

      const handleSignOut = async () => {
        if (supabase) {
          try {
            await supabase.auth.signOut();
          } catch(e) {}
        }
        setUser(null);
        try {
          localStorage.removeItem('kavach_user');
        } catch(e) {}
        navigate('/');
      };

      const handleTriggerEnter = () => {

          setIsNavOpen(true);

                    aria-label="Toggle navigation menu"
                    title={isNavOpen ? "Close navigation" : "Open navigation"}
                  >
                    <IconMenu className="w-5 h-5" />
                  </button>
                )}

                <button

                  className="flex items-center gap-2.5 group cursor-pointer text-left"
                >
                  <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-blue-600 to-indigo-700 text-white flex items-center justify-center shadow-xs group-hover:scale-105 transition-transform shrink-0">
                    <IconShield className="w-4.5 h-4.5 text-amber-300" />

                      <span className="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse" />

              {/* CENTER: Subtle live status pill */}

                  <IconShield className="w-3.5 h-3.5 text-blue-600 dark:text-blue-400" />

                {route === '/auth' && <AuthPage onNavigate={navigate} onLogin={handleLogin} />}
                {route === '/dashboard' && (
                  user ? <DashboardPage onNavigate={navigate} /> : (
                    <div className="flex flex-col items-center justify-center min-h-[50vh] space-y-4 animate-fade-in text-center p-4">
                      <div className="w-10 h-10 rounded-full border-3 border-blue-200 dark:border-blue-900 border-t-blue-600 dark:border-t-blue-400 animate-spin" />
                      <div>
                        <p className="text-sm font-bold text-slate-800 dark:text-slate-200">Arming MONEYCRAFT Shield...</p>
                        <p className="text-xs text-slate-500 dark:text-slate-400 mt-1">Verifying Google authentication with Supabase</p>
                      </div>
                      <button
                        type="button"
                        onClick={() => {
                          window.location.hash = '/auth';
                          setRoute('/auth');
                        }}
                        className="text-xs text-blue-600 dark:text-blue-400 underline font-semibold hover:text-blue-700 cursor-pointer pt-2"
                      >
                        Taking longer than expected? Return to Sign-In
                      </button>
                    </div>
                  )
                )}
                {user && route === '/shield' && <ShieldPage />}
                {user && route === '/spend' && <SpendPage />}
                {user && (route === '/chat' || route === '/save') && <DashboardPage onNavigate={navigate} />}
                {user && route === '/goals' && <GoalsPage />}
                {user && route === '/quiz' && <QuizPage onNavigate={navigate} />}
              </div>
            </main>

          </div>

          {/* GLOBAL FLOATING CHATBOT COPILOT */}
          {user && route !== '/' && route !== '/auth' && (
            <ChatWidget user={user} onNavigate={navigate} />
          )}

        </div>
      );
    }

    // ==========================================
    // TOP-LEVEL REACT ERROR BOUNDARY
    // ==========================================
    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }

      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }

      componentDidCatch(error, errorInfo) {
        console.error("MONEYCRAFT Caught Error:", error, errorInfo);
      }

      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen flex items-center justify-center bg-slate-50 dark:bg-[#0b0f17] p-6 text-slate-900 dark:text-slate-100 text-center font-sans">
              <div className="max-w-md w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-8 shadow-2xl space-y-4">
                <div className="w-12 h-12 rounded-2xl bg-amber-100 dark:bg-amber-950/60 text-amber-600 flex items-center justify-center mx-auto">
                  <IconShieldAlert className="w-6 h-6" />
                </div>
                <h2 className="text-xl font-bold">Session Recovery</h2>
                <p className="text-xs text-slate-500 dark:text-slate-400">
                  {this.state.error?.message || "An unexpected error occurred while loading your profile."}
                </p>
                <button
                  onClick={() => {
                    try { localStorage.removeItem('kavach_user'); } catch(e) {}
                    window.location.hash = '/auth';
                    window.location.reload();
                  }}
                  className="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold rounded-xl cursor-pointer transition-all shadow-sm shadow-blue-500/20"
                >
                  Clear Session & Return to Login
                </button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
