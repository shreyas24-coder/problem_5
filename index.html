    // ==========================================
    // 1. SIGN UP MODAL
    // ==========================================
    function SignUpModal({ isOpen, onClose, onComplete, lang }) {
      const [step, setStep] = useState(1);
      const [name, setName] = useState('');
      const [phone, setPhone] = useState('');
      const [otp, setOtp] = useState(['', '', '', '']);
      const [errorMsg, setErrorMsg] = useState('');

      if (!isOpen) return null;

      const handleStep1 = (e) => {
        e.preventDefault();
        if (!name.trim() || phone.length < 10) {
          setErrorMsg('Please enter your name and 10-digit number');
          return;
        }
        setErrorMsg('');
        setStep(2);
      };

      const handleStep2 = (e) => {
        e.preventDefault();
        if (otp.join('').length < 4) {
          setErrorMsg('Please enter 4 digits');
          return;
        }
        setErrorMsg('');
        setStep(3);
        if (onComplete) onComplete({ name: name || 'Shreyas Patel', phone: phone || '9876543210' });
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-stone-900/60 backdrop-blur-sm animate-fade-in">
          <div className="relative w-full max-w-md bg-white rounded-3xl border-2 border-stone-300 shadow-2xl p-6 sm:p-7 text-stone-900">
            <button onClick={onClose} className="absolute top-4 right-4 w-9 h-9 rounded-full bg-stone-100 flex items-center justify-center text-stone-600">
              <IconX className="w-5 h-5" />
            </button>

            <div className="flex items-center gap-1.5 mb-5">
              {[1, 2, 3].map((s) => (
                <div key={s} className={`h-1.5 rounded-full ${s === step ? 'w-8 bg-stone-900' : s < step ? 'w-4 bg-emerald-500' : 'w-4 bg-stone-200'}`} />
              ))}
              <span className="text-[11px] font-bold text-stone-400 ml-auto">Step {step} of 3</span>
            </div>

            {step === 1 && (
              <form onSubmit={handleStep1} className="space-y-4 text-left">
                <h2 className="text-2xl font-black text-stone-900">Join Kavach Free</h2>
                <p className="text-xs text-stone-600">Enter details linked with your primary UPI number.</p>
                <div>
                  <label className="block text-xs font-bold uppercase text-stone-700 mb-1">Your Name</label>
                  <input type="text" value={name} onChange={e => setName(e.target.value)} placeholder="e.g. Shreyas Patel" className="w-full min-h-[48px] bg-stone-50 border border-stone-300 rounded-xl px-4 text-base outline-none" required />
                </div>
                <div>
                  <label className="block text-xs font-bold uppercase text-stone-700 mb-1">Mobile Number (UPI)</label>
                  <div className="flex items-center">
                    <span className="min-h-[48px] px-3.5 bg-stone-100 border border-r-0 border-stone-300 rounded-l-xl flex items-center font-bold text-sm">+91</span>
                    <input type="tel" maxLength={10} value={phone} onChange={e => setPhone(e.target.value.replace(/\D/g, ''))} placeholder="98765 43210" className="flex-1 min-h-[48px] bg-stone-50 border border-stone-300 rounded-r-xl px-4 text-base outline-none" required />
                  </div>
                </div>
                {errorMsg && <p className="text-rose-600 text-xs font-bold">{errorMsg}</p>}
                <button type="submit" className="w-full min-h-[50px] rounded-xl bg-stone-900 text-white font-bold flex items-center justify-center gap-2 cursor-pointer shadow-md">
                  <span>Send OTP</span>
                  <IconArrowRight className="w-4 h-4" />
                </button>
              </form>
            )}

            {step === 2 && (
              <form onSubmit={handleStep2} className="space-y-4 text-left">
                <h2 className="text-2xl font-black text-stone-900">Verify Code</h2>
                <p className="text-xs text-stone-600">Code sent to +91 {phone || '9876543210'}</p>
                <div className="flex justify-between gap-2 max-w-[240px] mx-auto py-2">
                  {otp.map((d, i) => (
                    <input key={i} id={`otp-${i}`} type="text" maxLength={1} value={d} onChange={e => {
                      const n = [...otp]; n[i] = e.target.value; setOtp(n);
                      if (e.target.value && i < 3) document.getElementById(`otp-${i+1}`)?.focus();
                    }} className="w-12 h-12 text-center text-xl font-black bg-stone-50 border-2 border-stone-300 rounded-xl outline-none" />
                  ))}
                </div>
                <div className="text-center">
                  <button type="button" onClick={() => setOtp(['2','4','2','6'])} className="px-3 py-1 bg-stone-100 border border-stone-300 text-xs font-bold rounded-lg cursor-pointer">
                    ⚡ Auto-Fill 2426
                  </button>
                </div>
                {errorMsg && <p className="text-rose-600 text-xs font-bold text-center">{errorMsg}</p>}
                <button type="submit" className="w-full min-h-[50px] rounded-xl bg-stone-900 text-white font-bold flex items-center justify-center gap-2 cursor-pointer shadow-md">
                  <span>Verify & Start</span>
                  <IconArrowRight className="w-4 h-4" />
                </button>
              </form>
            )}

            {step === 3 && (
              <div className="text-center space-y-4 py-2">
                <div className="w-14 h-14 rounded-full bg-emerald-100 text-emerald-700 flex items-center justify-center mx-auto">
                  <IconShield className="w-7 h-7" />
                </div>
                <h3 className="text-2xl font-black text-stone-900">Protection Active!</h3>
                <p className="text-xs text-stone-600">Welcome, {name || 'Shreyas'}. Your UPI pre-transaction shield is armed.</p>
                <button onClick={onClose} className="w-full min-h-[50px] rounded-xl bg-stone-900 text-white font-bold cursor-pointer shadow-md">
                  Enter App
                </button>
              </div>
            )}
          </div>
        </div>
      );
    }

          </div>

          <div className="grid grid-cols-2 lg:grid-cols-4 gap-3.5">

              <span className="text-[11px] font-bold text-stone-400 uppercase block mb-1">Stipend Inflow</span>
              <span className="text-xl sm:text-2xl font-black text-stone-900 block">₹12,000</span>
              <span className="text-[11px] text-emerald-700 font-bold">Credited via Razorpay</span>
            </div>
            <div className="bg-white p-4 rounded-3xl border-2 border-stone-200 shadow-sm">

              <span className="text-[11px] text-stone-500">Across 14 UPI taps</span>
            </div>
            <div className="bg-white p-4 rounded-3xl border-2 border-stone-200 shadow-sm">
              <span className="text-[11px] font-bold text-stone-400 uppercase block mb-1">Total Saved</span>

            <div className="bg-white p-4 rounded-3xl border-2 border-stone-200 shadow-sm">

              <span className="text-xl sm:text-2xl font-black text-emerald-700 block">₹475/day</span>
              <span className="text-[11px] text-stone-500">24 days remaining</span>
            </div>
          </div>

          {/* Weekly Spending Bar Chart */}
          <div className="bg-white p-5 sm:p-6 rounded-3xl border-2 border-stone-300 shadow-sm">
            <div className="flex items-center justify-between mb-4">
              <div>
                <div className="flex items-center gap-2">
                  <IconBarChart3 className="w-5 h-5 text-stone-700" />
                  <h2 className="text-lg font-black text-stone-900">Spending Pulse (Weekly Bar Graph)</h2>
                </div>
                <p className="text-xs text-stone-500 font-medium">Average: ₹487/day. Peak on Thursday (group dining split).</p>
              </div>
            </div>

            <div className="h-44 w-full flex items-end justify-between gap-2 pt-6 pb-2 border-b border-stone-100">
              {weeklyData.map((d) => (
                <div key={d.day} className="flex-1 flex flex-col items-center gap-1 h-full justify-end group">
                  <span className="text-[10px] font-bold text-stone-400 group-hover:text-stone-900 transition-colors">₹{d.amount}</span>

          {/* Allocation Breakdown */}

                    <div className="flex justify-between text-xs font-bold text-stone-700 mb-1">

    function QuizPage({ lang, onNavigate }) {
      const questions = [
        {
          id: 1,
          q: "A text message says 'Claim your ₹3,500 refund here'. Clicking it asks for your UPI PIN. What happens if you enter it?",
          opts: [
            { id: 'a', t: "₹3,500 is credited to your bank account", ok: false },
            { id: 'b', t: "₹3,500 is debited (taken away) from your account", ok: true },
            { id: 'c', t: "Your bank sends an SMS confirmation", ok: false }
          ],
          exp: "Golden Rule: You NEVER need to enter your UPI PIN to receive refunds or money. Entering your PIN always debits money."
        },
        {
          id: 2,
          q: "When subscribing to a 'Free 7-Day OTT Trial' with AutoPay, when is the best time to cancel the mandate?",
          opts: [
            { id: 'a', t: "After a month when money is deducted", ok: false },
            { id: 'b', t: "Immediately or on Day 5 before auto-debit triggers", ok: true },
            { id: 'c', t: "Free trials cancel automatically", ok: false }
          ],
          exp: "AutoPay mandates automatically renew and deduct money once trials expire. Canceling before Day 7 keeps your wallet safe."
        },
        {
          id: 3,
          q: "What is the recommended Emergency Fund size for a student or young freelancer with irregular income?",
          opts: [
            { id: 'a', t: "1 week of pocket money", ok: false },
            { id: 'b', t: "3 to 6 months of essential living expenses in liquid funds", ok: true },
            { id: 'c', t: "All money invested in crypto", ok: false }
          ],
          exp: "A 3-6 month cash reserve prevents you from high-interest debt when client invoices or stipends are delayed."
        },
        {
          id: 4,
          q: "Why is saving ₹1,000/mo at age 20 often better than saving ₹3,000/mo starting at age 35?",
          opts: [
            { id: 'a', t: "Compound interest gives your money 15 extra years to multiply exponentially", ok: true },
            { id: 'b', t: "Banks only pay interest under age 25", ok: false },
            { id: 'c', t: "Stock market prices never drop in your 20s", ok: false }
          ],
          exp: "Time in the market beats timing the market. Compound interest turns early micro-savings into exponential returns."
        }
      ];

      const [cur, setCur] = useState(0);
      const [answers, setAnswers] = useState({});
      const [done, setDone] = useState(false);

      const q = questions[cur];
      const isAns = answers[q.id] !== undefined;

      const handlePick = (opt) => {
        if (isAns) return;
        setAnswers({ ...answers, [q.id]: { id: opt.id, ok: opt.ok } });
      };

      const score = Object.values(answers).filter(a => a.ok).length;

      return (
        <div className="flex flex-col animate-fade-in text-left space-y-6 max-w-xl mx-auto">
          <div className="pb-2 border-b border-stone-200">
            <div className="flex justify-between items-center mb-1.5">
              <span className="px-3 py-1 rounded-full bg-amber-100 text-stone-800 text-xs font-bold">Daily Money IQ</span>
              <span className="px-3 py-1 rounded-full bg-orange-100 text-orange-800 text-xs font-black flex items-center gap-1">
                <IconFlame className="w-3.5 h-3.5 text-orange-600" /> 3-Day Streak
              </span>
            </div>
            <h1 className="text-2xl sm:text-3xl font-black text-stone-900">Daily Money & Scam Quiz</h1>
            <p className="text-xs sm:text-sm text-stone-600 font-medium">Test your digital money smarts in 90 seconds and build your financial literacy score.</p>
          </div>

          {!done ? (
            <div className="bg-white p-5 sm:p-7 rounded-3xl border-2 border-stone-300 shadow-md">
              <div className="flex justify-between text-xs font-bold text-stone-400 mb-2">
                <span>Question {cur + 1} of {questions.length}</span>
                <span>Score: {score} pts</span>
              </div>
              <div className="w-full h-1.5 bg-stone-100 rounded-full mb-4">
                <div className="h-full bg-stone-900 rounded-full" style={{ width: `${((cur + 1) / questions.length) * 100}%` }} />
              </div>

              <h2 className="text-base sm:text-lg font-black text-stone-900 mb-4">{q.q}</h2>

              <div className="space-y-2.5 mb-4">
                {q.opts.map(opt => {
                  const ans = answers[q.id];
                  let style = "bg-stone-50 border-stone-200 text-stone-800";
                  if (isAns) {
                    if (opt.ok) style = "bg-emerald-50 border-emerald-500 text-emerald-950 font-bold";
                    else if (ans?.id === opt.id) style = "bg-rose-50 border-rose-500 text-rose-950 font-bold";
                    else style = "opacity-50";
                  }
                  return (
                    <button key={opt.id} onClick={() => handlePick(opt)} disabled={isAns} className={`w-full p-3.5 rounded-2xl border-2 text-left text-xs sm:text-sm cursor-pointer transition-all ${style}`}>
                      {opt.t}
                    </button>
                  );
                })}
              </div>

              {isAns && (
                <div className="p-3.5 bg-stone-100 rounded-2xl text-xs text-stone-700 mb-4 border border-stone-200">
                  <strong className="block mb-0.5 text-stone-900">Financial Insight:</strong> {q.exp}
                </div>
              )}

              {isAns && (
                <button onClick={() => {
                  if (cur < questions.length - 1) setCur(cur + 1);
                  else setDone(true);
                }} className="w-full min-h-[48px] bg-stone-900 text-white font-bold rounded-xl cursor-pointer shadow-md">
                  {cur < questions.length - 1 ? "Next Question" : "View Score"}
                </button>
              )}
            </div>
          ) : (
            <div className="bg-white p-6 sm:p-8 rounded-3xl border-2 border-stone-300 shadow-xl text-center space-y-5">
              <div className="w-16 h-16 rounded-full bg-amber-100 text-amber-800 flex items-center justify-center mx-auto">
                <IconTrophy className="w-8 h-8" />
              </div>
              <h2 className="text-2xl font-black text-stone-900">Quiz Completed!</h2>
              <p className="text-sm font-bold text-stone-600">You scored {score} / {questions.length} ({Math.round((score / questions.length) * 100)}%)</p>
              <div className="p-4 bg-stone-50 rounded-2xl border border-stone-200">
                <span className="text-xs font-bold text-stone-400 block mb-1">Financial Knowledge Tier</span>
                <span className="text-base font-black text-stone-900">
                  {score >= 3 ? "🛡️ Kavach Grandmaster (High IQ)" : "🌱 Smart Learner (Keep Going!)"}
                </span>
              </div>
              <div className="space-y-2 pt-2">
                <button onClick={() => { setAnswers({}); setCur(0); setDone(false); }} className="w-full min-h-[48px] bg-stone-100 rounded-xl font-bold text-sm cursor-pointer">
                  Retake Quiz
                </button>
                <button onClick={() => onNavigate('/dashboard')} className="w-full min-h-[48px] bg-stone-900 text-white rounded-xl font-bold text-sm cursor-pointer shadow-md">
                  Back to Dashboard
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

          {/* Feature Pillars */}

            >
              <span className="text-xs font-mono font-bold bg-amber-100 text-amber-900 px-2 py-0.5 rounded">SHIELD</span>
              <h3 className="text-base font-black mt-2 mb-1">Pre-transaction Scam Checks</h3>
              <p className="text-xs text-stone-500 mb-3">Pre-transaction scam checks in under 3 seconds.</p>

            >
              <span className="text-xs font-mono font-bold bg-blue-100 text-blue-900 px-2 py-0.5 rounded">SPEND</span>
              <h3 className="text-base font-black mt-2 mb-1">Irregular Stipend Cashflow</h3>
              <p className="text-xs text-stone-500 mb-3">Tracks your irregular income and stipends, not just standard 30-day salaries.</p>
              <span className="text-xs font-bold underline text-stone-900">
                {user ? 'Track Cashflow ➔' : 'Sign Up to Unlock ➔'}

            <div
              onClick={() => handleAction('/save')}
              className="p-5 bg-white rounded-3xl border-2 border-stone-200 hover:border-stone-900 cursor-pointer transition-all text-left"
            >
              <span className="text-xs font-mono font-bold bg-emerald-100 text-emerald-900 px-2 py-0.5 rounded">SAVE</span>

              <p className="text-xs text-stone-500 mb-3">Finds forgotten ₹99 AutoPay mandates and turns them into savings goals.</p>
              <span className="text-xs font-bold underline text-stone-900">
                {user ? 'Audit Leaks ➔' : 'Sign Up to Unlock ➔'}
              </span>
            </div>
          </section>

          {/* Educational News & Investing Smarts */}
          <section>
            <div className="flex items-center gap-2 mb-1 text-xs font-bold uppercase tracking-wider text-amber-700">
              <IconBookOpen className="w-4 h-4" /> Smart Money Academy & RBI Advisories
            </div>
            <h2 className="text-2xl font-black text-stone-900 mb-4">Financial Smarts for Young Bharat</h2>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
              {articles.map(a => (
                <div key={a.id} onClick={() => setModalArticle(a)} className="p-4.5 bg-white rounded-3xl border-2 border-stone-200 hover:border-stone-400 cursor-pointer transition-all">

                  <h4 className="text-sm font-bold text-stone-900 mt-1.5 mb-1">{a.title}</h4>

                  <span className="text-xs font-bold text-stone-900 underline flex items-center gap-1">Read 2-Min Rule <IconChevronRight className="w-3.5 h-3.5" /></span>

    // ==========================================
    // MAIN ROOT APP (With Authenticated Route Guarding)
    // ==========================================
    function App() {
      const [lang, setLang] = useState('en');
      const [user, setUser] = useState(() => {
        try {
          const saved = localStorage.getItem('kavach_user');
          return saved ? JSON.parse(saved) : null;
        } catch(e) {
          return null;
        }
      });

      const getRoute = () => {
        const h = window.location.hash.replace(/^#/, '') || '/';
        return h.startsWith('/') ? h : '/' + h;
      };

      const [route, setRoute] = useState(getRoute());

      useEffect(() => {
        const onHash = () => {
          const current = getRoute();
          if (!user && current !== '/' && current !== '/auth') {
            window.location.hash = '/auth';
            setRoute('/auth');
            return;
          }
          setRoute(current);
        };
        window.addEventListener('hashchange', onHash);
        return () => window.removeEventListener('hashchange', onHash);
      }, [user]);

      useEffect(() => {
        if (!user && route !== '/' && route !== '/auth') {
          window.location.hash = '/auth';
          setRoute('/auth');
        }
      }, [user, route]);

      const navigate = (p) => {
        if (!user && p !== '/' && p !== '/auth') {
          window.location.hash = '/auth';
          setRoute('/auth');
          window.scrollTo({ top: 0, behavior: 'smooth' });
          return;
        }
        window.location.hash = p;
        setRoute(p);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const handleLogin = (u) => {
        setUser(u);
        try {
          localStorage.setItem('kavach_user', JSON.stringify(u));
        } catch(e) {}
        navigate('/dashboard');
      };

      const handleSignOut = () => {
        setUser(null);
        try {
          localStorage.removeItem('kavach_user');
        } catch(e) {}
        navigate('/');
      };

      const navItems = [
        { to: '/', label: 'Home', icon: IconHome },
        { to: '/dashboard', label: 'Dashboard', icon: IconDashboard },
        { to: '/shield', label: 'Shield', icon: IconShield },
        { to: '/goals', label: 'Goals', icon: IconTarget },
        { to: '/quiz', label: 'Quiz', icon: IconHelpCircle }
      ];

      return (
        <div className="min-h-screen bg-[#fbfbf9] text-stone-900 font-sans flex flex-col justify-between selection:bg-amber-200">
          
          <div className="fixed inset-0 overflow-hidden pointer-events-none -z-10">
            <div className="absolute top-0 left-1/2 -translate-x-1/2 w-[42rem] h-[22rem] bg-gradient-to-b from-amber-100/60 via-orange-50/40 to-transparent blur-3xl rounded-full" />
            <div className="absolute top-72 -left-20 w-80 h-80 bg-emerald-100/30 blur-3xl rounded-full" />
            <div className="absolute top-96 -right-20 w-80 h-80 bg-blue-100/30 blur-3xl rounded-full" />
          </div>

          {/* Top Header */}
          <header className="sticky top-0 z-40 w-full backdrop-blur-md bg-[#fbfbf9]/90 border-b border-stone-200/80">
            <div className="max-w-md md:max-w-4xl mx-auto px-4 h-18 py-3 flex items-center justify-between">
              <button onClick={() => navigate(user ? '/dashboard' : '/')} className="flex items-center gap-2 cursor-pointer text-left">
                <div className="w-10 h-10 rounded-2xl bg-stone-900 text-amber-400 flex items-center justify-center shadow-md">
                  <IconShield className="w-5 h-5" />
                </div>
                <div>
                  <span className="text-2xl font-black text-stone-900 flex items-center gap-1.5">
                    Kavach <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                  </span>
                  <span className="text-[10px] font-bold text-stone-500 uppercase tracking-wider block -mt-1">Money Copilot</span>
                </div>
              </button>

              {/* Desktop quick links - ONLY when user is authenticated */}
              {user && (
                <div className="hidden md:flex items-center gap-4 text-xs font-bold text-stone-600">
                  <button onClick={() => navigate('/dashboard')} className="hover:text-stone-900 cursor-pointer">Dashboard</button>
                  <button onClick={() => navigate('/shield')} className="hover:text-stone-900 cursor-pointer">Shield</button>
                  <button onClick={() => navigate('/spend')} className="hover:text-stone-900 cursor-pointer">Transactions</button>
                  <button onClick={() => navigate('/save')} className="hover:text-stone-900 cursor-pointer">AutoPay Audit</button>
                  <button onClick={() => navigate('/goals')} className="hover:text-stone-900 cursor-pointer">Goals</button>
                  <button onClick={() => navigate('/quiz')} className="hover:text-stone-900 cursor-pointer">Daily Quiz</button>
                </div>
              )}

              <div className="flex items-center gap-2">
                {user ? (
                  <div className="flex items-center gap-1.5 bg-emerald-50 border border-emerald-300 px-3 py-1 rounded-full text-xs font-bold text-emerald-950 shadow-sm">
                    <span className="w-2 h-2 rounded-full bg-emerald-600 animate-pulse"></span>
                    <span>{user.name.split(' ')[0]}</span>
                    <button onClick={handleSignOut} className="text-[10px] underline ml-1 cursor-pointer font-semibold text-emerald-800">Exit</button>
                  </div>
                ) : (
                  <button onClick={() => navigate('/auth')} className="min-h-[44px] px-4 py-2 rounded-full bg-stone-900 text-white text-xs font-bold flex items-center gap-1.5 cursor-pointer shadow-sm">
                    <IconSparkles className="w-3.5 h-3.5 text-amber-400" />
                    <span>{lang === 'en' ? 'Sign Up' : 'साइन अप'}</span>
                  </button>
                )}

                <div className="flex bg-stone-100 p-0.5 rounded-full border border-stone-300 text-xs font-bold">
                  <button onClick={() => setLang('en')} className={`px-2.5 py-1 rounded-full ${lang === 'en' ? 'bg-stone-900 text-white' : 'text-stone-600'}`}>EN</button>
                  <button onClick={() => setLang('hi')} className={`px-2.5 py-1 rounded-full ${lang === 'hi' ? 'bg-stone-900 text-white' : 'text-stone-600'}`}>हि</button>
                </div>
              </div>
            </div>
          </header>

          {/* Main Body Container */}
          <main className={`flex-1 w-full max-w-md md:max-w-4xl mx-auto px-3.5 sm:px-6 pt-5 ${user && route !== '/auth' ? 'pb-28 sm:pb-32' : 'pb-12 sm:pb-16'}`}>
            {route === '/' && <LandingPage lang={lang} user={user} onNavigate={navigate} />}
            {route === '/auth' && <AuthPage lang={lang} onNavigate={navigate} onLogin={handleLogin} />}
            {user && route === '/dashboard' && <DashboardPage lang={lang} onNavigate={navigate} />}
            {user && route === '/shield' && <ShieldPage lang={lang} />}
            {user && route === '/spend' && <SpendPage lang={lang} />}
            {user && route === '/save' && <SavePage lang={lang} />}
            {user && route === '/goals' && <GoalsPage lang={lang} />}
            {user && route === '/quiz' && <QuizPage lang={lang} onNavigate={navigate} />}
          </main>

          {/* Sticky Bottom Tab Bar - Rendered ONLY if user is authenticated and not on /auth */}
          {user && route !== '/auth' && (
            <nav className="fixed bottom-0 left-0 right-0 z-40 bg-[#fbfbf9]/95 backdrop-blur-lg border-t border-stone-200/90 shadow-[0_-4px_20px_rgba(0,0,0,0.05)]">
              <div className="max-w-md md:max-w-4xl mx-auto px-1 flex items-center justify-between h-20">
                {navItems.map((item) => {
                  const Icon = item.icon;
                  const isActive = route === item.to;
                  return (
                    <button
                      key={item.to}
                      onClick={() => navigate(item.to)}
                      className={`flex flex-col items-center justify-center flex-1 min-h-[48px] py-1 transition-all cursor-pointer ${
                        isActive ? 'text-stone-950 font-extrabold' : 'text-stone-500 hover:text-stone-800'
                      }`}
                    >
                      <div className={`w-9 h-7 rounded-xl flex items-center justify-center mb-0.5 transition-all ${
                        isActive ? 'bg-stone-900 text-amber-400 shadow-sm scale-105' : 'hover:bg-stone-200/60'
                      }`}>
                        <Icon className="w-4 h-4" />
                      </div>
                      <span className="text-[10px] font-bold tracking-tight">{item.label}</span>
                      {isActive && <span className="w-1.5 h-1.5 bg-amber-500 rounded-full mt-0.5"></span>}
                    </button>
                  );
                })}
              </div>
            </nav>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
