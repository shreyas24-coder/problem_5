                    if (opt.ok) style = "bg-emerald-50 dark:bg-emerald-950/40 border-emerald-500 text-emerald-950 dark:text-emerald-200 font-semibold";
                    else if (ans?.id === opt.id) style = "bg-rose-50 dark:bg-rose-950/40 border-rose-500 text-rose-950 dark:text-rose-200 font-semibold";
                    else style = "opacity-40 border-slate-200 dark:border-slate-700";
                  }
                  return (
                    <button
                      key={opt.id}
                      onClick={() => handlePick(opt)}
                      disabled={isAns}
                      className={`w-full p-3.5 rounded-xl border text-left text-xs sm:text-sm cursor-pointer transition-all ${style}`}

                      {opt.t}
                    </button>

                })}

              {isAns && (

                  {q.exp}
                </div>
              )}

              {isAns && (
                <button
                  onClick={() => {
                    if (cur < questions.length - 1) setCur(cur + 1);
                    else setDone(true);
                  }}
                  className="w-full min-h-[46px] bg-blue-600 hover:bg-blue-700 text-white font-semibold text-sm rounded-xl cursor-pointer shadow-xs transition-all active:scale-[0.98]"
                >
                  {cur < questions.length - 1 ? "Next Question" : "View Score"}
                </button>
              )}
            </div>
          ) : (
            <div className="bg-white dark:bg-slate-900 p-6 sm:p-8 rounded-2xl border border-slate-200/90 dark:border-slate-800 shadow-xs text-center space-y-4">
              <div className="w-14 h-14 rounded-2xl bg-amber-50 dark:bg-amber-950/50 text-amber-600 dark:text-amber-400 flex items-center justify-center mx-auto border border-amber-200/60 dark:border-amber-800/60">

              <div className="p-3.5 bg-slate-50 dark:bg-slate-800/60 rounded-xl border border-slate-200/60 dark:border-slate-700 max-w-sm mx-auto">

                <span className="text-sm font-bold text-slate-900 dark:text-white">

              <div className="space-y-2 pt-2 max-w-sm mx-auto">
                <button
                  onClick={() => { setAnswers({}); setCur(0); setDone(false); }}

                >
                  Retake Quiz
                </button>
                <button
                  onClick={() => onNavigate('/dashboard')}
                  className="w-full min-h-[44px] bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-semibold text-sm cursor-pointer shadow-xs transition-all active:scale-[0.98]"
                >
                  Back to Dashboard
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    function ChatWidget({ user, onNavigate }) {
      const [isOpen, setIsOpen] = useState(false);
      const [inputMessage, setInputMessage] = useState('');
      const [isTyping, setIsTyping] = useState(false);
      const messagesEndRef = useRef(null);

      const firstName = (user && typeof user.name === 'string') ? (user.name.split(' ')[0] || 'there') : 'there';

      const [messages, setMessages] = useState([
        {
          id: 1,
          sender: 'bot',
          time: 'Just now',
          text: `Hello ${firstName}! I am your Kavach FinTech Copilot. I can answer questions about UPI fraud traps, irregular stipend budgeting, daily spend caps, or savings pace. What would you like to check today?`,
          suggestions: [
            "How to save ₹5,000 on a student stipend?",
            "Is this SMS a scam: 'Electricity unpaid, pay now'?",
            "Liquid Mutual Funds vs 2.7% Savings Account",
            "How do I set a daily expense budget?"
          ]
        }
      ]);

      const scrollToBottom = () => {
        if (messagesEndRef.current) {
          messagesEndRef.current.scrollIntoView({ behavior: 'smooth' });
        }
      };

      useEffect(() => {
        if (isOpen) {
          scrollToBottom();
        }
      }, [messages, isTyping, isOpen]);

      const getBotResponse = (query) => {
        const q = query.toLowerCase();

        if (q.includes('scam') || q.includes('electricity') || q.includes('pin') || q.includes('refund') || q.includes('fake') || q.includes('qr')) {
          return {
            text: "🚨 UPI Safety Warning: Legitimate refunds or bill payments NEVER require entering your UPI PIN or scanning a QR code sent over WhatsApp/SMS! Fraudsters frequently impersonate power boards or customer care. If a screen asks for your UPI PIN, money is being DEBITED from your bank.",
            action: { label: "Test in Scam Shield", path: "/shield" }
          };
        }

        if (q.includes('stipend') || q.includes('save') || q.includes('5000') || q.includes('budget') || q.includes('salary')) {
          return {
            text: "💡 Smart Payout Strategy: When your stipend or gig money lands, immediately lock away 25-30% into your Savings Goals. Divide the remaining money by the days until your next payout to set a strict Daily Spend Cap (e.g. ₹250/day). Any unspent money rolls over to your weekend fun pot!",
            action: { label: "Track in Cashflow", path: "/spend" }
          };
        }

        if (q.includes('liquid') || q.includes('fund') || q.includes('interest') || q.includes('invest') || q.includes('sip')) {
          return {
            text: "📈 Micro-Investing Hack: Leaving stipend money in a regular bank account earns barely 2.5–3% p.a. Overnight and Liquid mutual funds invest in government-backed T-bills, earning ~6.8% with instant 1-day UPI withdrawal. It keeps your emergency cash beating inflation with zero stock market drama.",
            action: { label: "Take Daily Quiz", path: "/quiz" }
          };
        }

        if (q.includes('chai') || q.includes('expense') || q.includes('track') || q.includes('daily') || q.includes('food')) {
          return {
            text: "☕ Micro-Expense Leak: Small ₹30 chai taps and ₹150 food deliveries often add up to over ₹4,500 every month without you realizing it. Use our Cashflow tab to log your daily expenses with one tap and see today's spent total instantly!",
            action: { label: "Log Daily Expense", path: "/spend" }
          };
        }

        if (q.includes('laptop') || q.includes('goal') || q.includes('buy') || q.includes('target')) {
          return {
            text: "🎯 Custom Goal Deposits: For any purchase like an M2 laptop or phone, break it down into flexible deposits. With Kavach, you can now deposit ANY variable amount (like ₹250, ₹640, or ₹2,000) whenever you get extra freelance or pocket money!",
            action: { label: "Open Goals Planner", path: "/goals" }
          };
        }

        return {
          text: "That's a great question! Staying on top of your digital finances is all about pre-transaction awareness and smart daily tracking. You can log income & daily expenses in Cashflow, check suspicious payment requests in Shield, or set variable savings in Goals. Let me know what specific goal you are working towards!",
          action: { label: "View Analytics Dashboard", path: "/dashboard" }
        };
      };

      const handleSendMessage = (textToSend) => {
        const text = textToSend || inputMessage;
        if (!text.trim()) return;

        const userMsg = {
          id: Date.now(),
          sender: 'user',
          time: 'Just now',
          text: text.trim()
        };

        setMessages((prev) => [...prev, userMsg]);
        setInputMessage('');
        setIsTyping(true);

        setTimeout(() => {
          const reply = getBotResponse(text);
          const botMsg = {
            id: Date.now() + 1,
            sender: 'bot',
            time: 'Just now',
            text: reply.text,
            action: reply.action
          };
          setMessages((prev) => [...prev, botMsg]);
          setIsTyping(false);
        }, 600);
      };

      const handleKeyDown = (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          handleSendMessage();
        }
      };

      return (
        <React.Fragment>
          {/* Floating Launcher Button */}
          <div className="fixed bottom-6 right-6 z-40 flex items-center gap-2.5">
            {!isOpen && (
              <div className="hidden sm:flex items-center gap-1.5 px-3 py-1.5 bg-slate-900 dark:bg-slate-800 text-white rounded-full text-xs font-semibold shadow-lg animate-fade-in border border-slate-700/60">
                <IconSparkles className="w-3.5 h-3.5 text-amber-400" />
                <span>Kavach Copilot</span>
              </div>
            )}
            <button
              type="button"
              onClick={() => setIsOpen(!isOpen)}
              aria-label="Toggle Kavach Chatbot"
              className="relative w-13 h-13 rounded-2xl bg-blue-600 hover:bg-blue-700 text-white flex items-center justify-center shadow-lg shadow-blue-500/25 transition-all cursor-pointer hover:scale-105 active:scale-95 border border-blue-400/30"
            >
              {isOpen ? (
                <IconX className="w-5 h-5 text-white" />
              ) : (
                <React.Fragment>
                  <IconBot className="w-6 h-6 text-white" />
                  <span className="absolute -top-0.5 -right-0.5 w-3 h-3 bg-emerald-500 rounded-full border-2 border-white dark:border-slate-900 animate-pulse" />
                </React.Fragment>
              )}
            </button>
          </div>

          {/* Floating Popover Chat Window */}
          {isOpen && (
            <div className="fixed bottom-22 right-4 sm:right-6 z-40 w-[92vw] sm:w-[390px] h-[540px] max-h-[80vh] bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-2xl flex flex-col overflow-hidden animate-fade-in text-left">
              
              {/* Header */}
              <div className="bg-slate-900 dark:bg-slate-950 text-white px-5 py-3.5 flex items-center justify-between border-b border-slate-800">
                <div className="flex items-center gap-2.5">
                  <div className="w-8 h-8 rounded-xl bg-blue-600 text-white flex items-center justify-center font-bold shadow-xs">
                    <IconBot className="w-4 h-4" />
                  </div>
                  <div>
                    <h3 className="text-sm font-bold tracking-tight flex items-center gap-1.5 text-white">
                      Kavach Copilot
                      <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse" />
                    </h3>
                    <span className="text-[10px] text-slate-400 font-medium block">

    function App() {
      // User authentication state
      const [user, setUser] = useState(() => {
        try {
          const saved = localStorage.getItem('kavach_user');
          return saved ? JSON.parse(saved) : null;
        } catch(e) {
          return null;
        }
      });

      // Process and persist authenticated Supabase User
      const processSupabaseUser = (authUser) => {
        if (!authUser) return;
        const email = String(authUser.email || '');
        let rawName = 'Kavach User';
        if (typeof authUser.user_metadata?.full_name === 'string' && authUser.user_metadata.full_name.trim()) {
          rawName = authUser.user_metadata.full_name.trim();
        } else if (typeof authUser.user_metadata?.name === 'string' && authUser.user_metadata.name.trim()) {
          rawName = authUser.user_metadata.name.trim();
        } else if (typeof authUser.user_metadata?.user_name === 'string' && authUser.user_metadata.user_name.trim()) {
          rawName = authUser.user_metadata.user_name.trim();
        } else if (email && email.includes('@')) {
          rawName = email.split('@')[0];
        }
        const name = String(rawName || 'Kavach User');
        const phone = String(authUser.phone || authUser.user_metadata?.phone || '9876543210');
        const avatar = (authUser.user_metadata?.avatar_url && typeof authUser.user_metadata.avatar_url === 'string')
          ? authUser.user_metadata.avatar_url
          : (authUser.user_metadata?.picture && typeof authUser.user_metadata.picture === 'string')
          ? authUser.user_metadata.picture
          : null;

        // Defensive Sync: Run asynchronously without blocking navigation
        if (supabase) {
          try {
            supabase.from('users').upsert({
              id: authUser.id,
              email: email,
              name: name,
              monthly_income: 45000.0,
              monthly_budget_cap: 20000.0
            }, { onConflict: 'id' }).then(({ error }) => {
              if (error) console.warn('Defensive sync to public.users warning:', error);
            }).catch(err => {
              console.warn('Defensive sync error:', err);
            });
          } catch (err) {
            console.warn('Defensive sync caught error:', err);
          }
        }

        const kavachUser = {
          id: String(authUser.id || ''),
          name: name,
          email: email,
          phone: phone,
          avatar: avatar,
          persona: 'student',
          provider: authUser.app_metadata?.provider || 'google'
        };

        setUser(kavachUser);
        try {
          localStorage.setItem('kavach_user', JSON.stringify(kavachUser));
        } catch(e) {}

        // Clean up OAuth hash or search tokens from address bar
        if (window.location.hash.includes('access_token=') || window.location.search.includes('code=')) {
          window.history.replaceState(null, '', window.location.pathname + '#/dashboard');
        }

        navigate('/dashboard', kavachUser);
      };

      // Listen for Supabase OAuth redirect & auth state changes
      useEffect(() => {
        if (!supabase) return;

        let isMounted = true;

        const initAuth = async () => {
          // 1. Extract 'code' from search query OR hash query
          let code = new URLSearchParams(window.location.search).get('code');
          const rawHash = window.location.hash || '';
          if (!code && rawHash.includes('code=')) {
            const hashPart = rawHash.includes('?') ? rawHash.split('?')[1] : rawHash.replace(/^#\/?/, '');
            code = new URLSearchParams(hashPart).get('code');
          }

          if (code) {
            try {
              const { data, error } = await supabase.auth.exchangeCodeForSession(code);
              if (!error && data?.session?.user && isMounted) {
                processSupabaseUser(data.session.user);
                return;
              }
            } catch (err) {
              console.warn('PKCE exchangeCodeForSession notice:', err);
            }
          }

          // 2. Extract access_token & refresh_token from hash OR search
          if (rawHash.includes('access_token=') || window.location.search.includes('access_token=')) {
            try {
              const combined = (rawHash + '&' + window.location.search).replace(/^#\/?/, '');
              const params = new URLSearchParams(combined);
              const accessToken = params.get('access_token');
              const refreshToken = params.get('refresh_token');
              if (accessToken) {
                const { data, error } = await supabase.auth.setSession({
                  access_token: accessToken,
                  refresh_token: refreshToken || ''
                });
                if (!error && data?.session?.user && isMounted) {
                  processSupabaseUser(data.session.user);
                  return;
                }
              }
            } catch (err) {
              console.warn('Hash setSession notice:', err);
            }
          }

          // 3. Check for existing session
          try {
            const { data, error } = await supabase.auth.getSession();
            if (!error && data?.session?.user && isMounted) {
              processSupabaseUser(data.session.user);
              return;
            }
          } catch (err) {
            console.warn('Supabase getSession notice:', err);
          }
        };

        initAuth();

        // 4. Listen for OAuth callbacks (SIGNED_IN, INITIAL_SESSION) or SIGNED_OUT
        const { data: { subscription } } = supabase.auth.onAuthStateChange(async (event, session) => {
          if ((event === 'SIGNED_IN' || event === 'INITIAL_SESSION') && session?.user && isMounted) {
            processSupabaseUser(session.user);
          } else if (event === 'SIGNED_OUT' && isMounted) {
            setUser(null);
            try { localStorage.removeItem('kavach_user'); } catch(e) {}
          }
        });

        // 5. Timeout safety: if on /dashboard without user after 3.5s, return to /auth
        const timeoutId = setTimeout(() => {
          if (isMounted) {
            const saved = localStorage.getItem('kavach_user');
            if (!saved && (window.location.hash.includes('code=') || window.location.hash.includes('access_token=') || window.location.search.includes('code='))) {
              console.warn('OAuth session handover timed out, redirecting to /auth');
              window.history.replaceState(null, '', window.location.pathname + '#/auth');
              setRoute('/auth');
            }
          }
        }, 3500);

        return () => {
          isMounted = false;
          clearTimeout(timeoutId);
          subscription?.unsubscribe();
        };
      }, []);

      // Navigation drawer state & hover timeout
      const [isNavOpen, setIsNavOpen] = useState(false);
      const navTimeoutRef = useRef(null);

      // Theme state with localStorage persistence (default: light)
      const [theme, setTheme] = useState(() => {
        try {
          return localStorage.getItem('kavach_theme') || 'light';
        } catch (e) {
          return 'light';
        }
      });

      // Apply theme to document root
      useEffect(() => {
        try {
          localStorage.setItem('kavach_theme', theme);
        } catch (e) {}

        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
        }
      }, [theme]);

      // Route management
      const getRoute = () => {
        const rawHash = window.location.hash || '';
        // If this is an OAuth token or code callback, stay on or land on /dashboard
        if (rawHash.includes('access_token=') || rawHash.includes('refresh_token=') || window.location.search.includes('code=')) {
          return '/dashboard';
        }
        const h = rawHash.replace(/^#/, '') || '/';
        return h.startsWith('/') ? h : '/' + h;
      };

      const [route, setRoute] = useState(getRoute());

      useEffect(() => {
        const onHash = () => {
          const rawHash = window.location.hash || '';
          if (rawHash.includes('access_token=') || window.location.search.includes('code=')) {
            return;
          }
          const current = getRoute();
          if (!user && current !== '/' && current !== '/auth') {
            window.location.hash = '/auth';
            setRoute('/auth');
            return;
          }
          setRoute(current);
        };
        window.addEventListener('hashchange', onHash);
        return () => window.removeEventListener('hashchange', onHash);
      }, [user]);

      // Route guard effect
      useEffect(() => {
        const rawHash = window.location.hash || '';
        const rawSearch = window.location.search || '';
        // Never wipe URL during active OAuth callback processing
        if (rawHash.includes('access_token=') || rawSearch.includes('code=')) {
          return;
        }

        if (!user && route !== '/' && route !== '/auth') {
          window.location.hash = '/auth';
          setRoute('/auth');
        }
      }, [user, route]);

      const navigate = (p, currentUser = null) => {
        setIsNavOpen(false);
        const activeUser = currentUser !== null ? currentUser : user;
        if (!activeUser && p !== '/' && p !== '/auth') {
          window.location.hash = '/auth';
          setRoute('/auth');
          window.scrollTo({ top: 0, behavior: 'smooth' });
          return;
        }
        window.location.hash = p;
        setRoute(p);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const handleLogin = (u) => {
        setUser(u);
        try {
          localStorage.setItem('kavach_user', JSON.stringify(u));
        } catch(e) {}
        navigate('/dashboard', u);
      };

      const handleSignOut = async () => {
        if (supabase) {
          try {
            await supabase.auth.signOut();
          } catch(e) {}
        }
        setUser(null);
        try {
          localStorage.removeItem('kavach_user');
        } catch(e) {}
        navigate('/');
      };

      // Desktop Hover Interaction Handlers (with grace tolerance)
      const handleTriggerEnter = () => {
        if (window.innerWidth >= 768) {
          if (navTimeoutRef.current) clearTimeout(navTimeoutRef.current);
          setIsNavOpen(true);
        }
      };

      const handleTriggerLeave = () => {
        if (window.innerWidth >= 768) {
          navTimeoutRef.current = setTimeout(() => {
            setIsNavOpen(false);
          }, 240);
        }
      };

      const handleDrawerEnter = () => {
        if (navTimeoutRef.current) clearTimeout(navTimeoutRef.current);
      };

      const handleDrawerLeave = () => {
        if (window.innerWidth >= 768) {
          navTimeoutRef.current = setTimeout(() => {
            setIsNavOpen(false);
          }, 240);
        }
      };

      const navItems = [
        { to: '/dashboard', label: 'Dashboard', icon: IconDashboard, desc: 'Pulse & analytics' },
        { to: '/shield', label: 'Scam Shield', icon: IconShield, desc: 'Pre-tap fraud check' },
        { to: '/spend', label: 'Daily Cashflow', icon: IconWallet, desc: 'Income & spend log' },
        { to: '/goals', label: 'Savings Goals', icon: IconTarget, desc: 'Future buy planner' },
        { to: '/quiz', label: 'Daily Quiz', icon: IconHelpCircle, desc: 'Test financial IQ' }
      ];

      const showSidebar = user && route !== '/auth' && route !== '/';

      return (
        <div className="min-h-screen bg-slate-50 dark:bg-[#0b0f17] text-slate-900 dark:text-slate-100 font-sans flex flex-col selection:bg-blue-100 dark:selection:bg-blue-900/60 transition-colors duration-200">
          
          {/* Subtle ambient lighting */}
          <div className="fixed inset-0 overflow-hidden pointer-events-none -z-10">
            <div className="absolute top-0 left-1/2 -translate-x-1/2 w-[54rem] h-[22rem] bg-gradient-to-b from-blue-100/40 dark:from-blue-950/20 via-slate-100/20 dark:via-transparent to-transparent blur-3xl rounded-full" />
            <div className="absolute top-72 -left-20 w-80 h-80 bg-emerald-100/25 dark:bg-emerald-950/15 blur-3xl rounded-full" />
            <div className="absolute top-96 -right-20 w-80 h-80 bg-blue-100/25 dark:bg-blue-950/15 blur-3xl rounded-full" />
          </div>

          {/* TOP HEADER: Compact, balanced, icon-only hamburger trigger */}
          <header className="sticky top-0 z-30 w-full backdrop-blur-md bg-white/90 dark:bg-[#111827]/90 border-b border-slate-200/80 dark:border-slate-800 shadow-xs transition-colors duration-200">
            <div className="w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              
              {/* Left Side: Icon-only Hamburger Trigger & Brand Logo */}
              <div className="flex items-center gap-3 w-1/3">
                {showSidebar && (
                  <button
                    type="button"
                    onClick={() => setIsNavOpen(!isNavOpen)}
                    onMouseEnter={handleTriggerEnter}
                    onMouseLeave={handleTriggerLeave}
                    className="w-10 h-10 rounded-xl flex items-center justify-center text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors cursor-pointer border border-transparent hover:border-slate-200 dark:hover:border-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500/20 shrink-0"
                    aria-label="Toggle navigation menu"
                    title={isNavOpen ? "Close navigation" : "Open navigation"}
                  >
                    <IconMenu className="w-5 h-5" />
                  </button>
                )}

                <button
                  onClick={() => navigate(user ? '/dashboard' : '/')}
                  className="flex items-center gap-2.5 group cursor-pointer text-left"
                >
                  <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-blue-600 to-indigo-700 text-white flex items-center justify-center shadow-xs group-hover:scale-105 transition-transform shrink-0">
                    <IconShield className="w-4.5 h-4.5 text-amber-300" />
                  </div>
                  <div className="flex flex-col text-left">
                    <span className="text-lg font-extrabold tracking-tight text-slate-900 dark:text-white flex items-center gap-1.5 leading-tight">
                      Kavach
                      <span className="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse" />
                    </span>
                    <span className="text-[10px] font-semibold text-slate-500 dark:text-slate-400 tracking-wider -mt-0.5 uppercase">
                      Money Copilot
                    </span>
                  </div>
                </button>
              </div>

              {/* CENTER: Subtle live status pill */}
              <div className="w-1/3 flex items-center justify-center text-center">
                <div className="hidden sm:inline-flex items-center gap-2 py-1 px-3 bg-slate-100/90 dark:bg-slate-800/80 border border-slate-200/80 dark:border-slate-700/80 rounded-full text-xs font-semibold text-slate-700 dark:text-slate-300 shadow-2xs">
                  <IconShield className="w-3.5 h-3.5 text-blue-600 dark:text-blue-400" />
                  <span className="font-bold text-slate-900 dark:text-white">Kavach</span>
                  <span className="text-slate-300 dark:text-slate-600">•</span>
                  <span className="text-[11px] text-slate-500 dark:text-slate-400">Active Money Shield</span>
                  <span className="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse" />
                </div>
              </div>

              {/* RIGHT: Profile badge & Logout button (or Sign In button) */}
              <div className="flex items-center justify-end gap-2.5 w-1/3">
                {user ? (
                  <div className="flex items-center gap-2.5">
                    {/* User profile pill */}
                    <div className="flex items-center gap-2 p-1 pr-2.5 bg-slate-100/80 dark:bg-slate-800/80 border border-slate-200/80 dark:border-slate-700/80 rounded-xl shadow-2xs">
                      <div className="relative">
                        <div className="w-8 h-8 rounded-lg bg-gradient-to-br from-amber-400 to-amber-500 text-slate-950 font-black text-xs flex items-center justify-center shadow-xs">
                          {user.name ? user.name.charAt(0).toUpperCase() : 'U'}
                        </div>
                        <span className="absolute -bottom-0.5 -right-0.5 w-2.5 h-2.5 rounded-full bg-emerald-500 border-2 border-white dark:border-slate-900" />
                      </div>
                      <div className="hidden md:flex flex-col text-left">
                        <span className="text-xs font-bold text-slate-900 dark:text-white leading-tight max-w-[110px] truncate">
                          {user.name}
                        </span>
                        <span className="text-[10px] font-semibold text-emerald-600 dark:text-emerald-400 leading-none">
                          {user.persona === 'freelance' ? 'Creator' : user.persona === 'junior' ? 'Early Career' : 'Student'} • Protected
                        </span>
                      </div>
                    </div>

                    {/* Logout button */}
                    <button
                      type="button"
                      onClick={handleSignOut}
                      title="Logout from Kavach"
                      className="min-h-[36px] px-3 rounded-xl border border-slate-200 dark:border-slate-800 hover:bg-rose-50 dark:hover:bg-rose-950/30 text-slate-600 dark:text-slate-400 hover:text-rose-600 dark:hover:text-rose-400 hover:border-rose-200 dark:hover:border-rose-900/50 text-xs font-semibold flex items-center gap-1.5 transition-all cursor-pointer"
                    >
                      <IconLogOut className="w-3.5 h-3.5" />
                      <span className="hidden sm:inline">Logout</span>
                    </button>
                  </div>
                ) : (
                  <button
                    type="button"
                    onClick={() => navigate('/auth')}
                    className="min-h-[38px] px-4 py-1.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-xs sm:text-sm font-bold flex items-center gap-1.5 shadow-sm shadow-blue-500/20 transition-all cursor-pointer active:scale-95"
                  >
                    <IconSparkles className="w-3.5 h-3.5 text-amber-300" />
                    <span>Sign Up</span>
                  </button>
                )}
              </div>

            </div>
          </header>

          {/* WORKSPACE: Slide-In Drawer Navigation + Main Content Area */}
          <div className="flex-1 flex w-full relative">
            
            {showSidebar && (
              <React.Fragment>
                {/* Backdrop Blur Overlay */}
                {isNavOpen && (
                  <div
                    onClick={() => setIsNavOpen(false)}
                    className="fixed inset-0 z-40 bg-slate-950/30 dark:bg-black/60 backdrop-blur-xs transition-opacity duration-300"
                    aria-hidden="true"
                  />
                )}

                {/* Left Drawer that slides rightward into view */}
                <aside
                  onMouseEnter={handleDrawerEnter}
                  onMouseLeave={handleDrawerLeave}
                  className={`fixed top-0 left-0 z-50 h-full w-72 sm:w-80 bg-white dark:bg-[#111827] border-r border-slate-200/90 dark:border-slate-800/90 flex flex-col justify-between shadow-2xl transition-transform duration-300 ease-out ${
                    isNavOpen ? 'translate-x-0' : '-translate-x-full'
                  }`}
                  aria-label="Navigation Drawer"
                >
                  <div className="p-5 space-y-6">
                    {/* Drawer Header */}
                    <div className="flex items-center justify-between pb-4 border-b border-slate-100 dark:border-slate-800">
                      <div className="flex items-center gap-2.5">
                        <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-blue-600 to-indigo-700 text-white flex items-center justify-center shadow-xs">
                          <IconShield className="w-4.5 h-4.5 text-amber-300" />
                        </div>
                        <div>
                          <span className="text-base font-bold tracking-tight text-slate-900 dark:text-white flex items-center gap-1 leading-tight">
                            Kavach
                            <span className="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse" />
                          </span>
                          <span className="text-[10px] font-semibold text-slate-400 dark:text-slate-500 uppercase tracking-wider block">
                            Navigation
                          </span>
                        </div>
                      </div>

                      <button
                        type="button"
                        onClick={() => setIsNavOpen(false)}
                        className="w-8 h-8 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 flex items-center justify-center cursor-pointer transition-colors"
                        aria-label="Close navigation"
                      >
                        <IconX className="w-4 h-4" />
                      </button>
                    </div>

                    {/* Nav Items */}
                    <div>
                      <span className="text-[10px] font-bold tracking-widest text-slate-400 dark:text-slate-500 uppercase block mb-2 pl-2">
                        Features
                      </span>

                      <nav className="space-y-1.5" aria-label="Sidebar Navigation">
                        {navItems.map((item) => {
                          const Icon = item.icon;
                          const isActive = route === item.to;

                          return (
                            <button
                              key={item.to}
                              type="button"
                              onClick={() => {
                                navigate(item.to);
                                setIsNavOpen(false);
                              }}
                              className={`w-full p-2.5 rounded-xl flex items-center gap-3 transition-all text-left group cursor-pointer ${
                                isActive
                                  ? 'bg-blue-50 dark:bg-blue-950/40 text-blue-700 dark:text-blue-300 border-l-3 border-blue-600 dark:border-blue-400 font-bold shadow-2xs'
                                  : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white hover:bg-slate-100/70 dark:hover:bg-slate-800/60 font-medium'
                              }`}
                            >
                              <div
                                className={`w-8 h-8 rounded-lg flex items-center justify-center shrink-0 transition-all ${
                                  isActive
                                    ? 'bg-blue-600 dark:bg-blue-500 text-white'
                                    : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 group-hover:bg-slate-200 dark:group-hover:bg-slate-700'
                                }`}
                              >
                                <Icon className="w-4 h-4" />
                              </div>
                              <div>
                                <span className="text-xs sm:text-sm font-semibold block leading-tight">
                                  {item.label}
                                </span>
                                <span className={`text-[10px] block leading-tight mt-0.5 ${isActive ? 'text-blue-600/75 dark:text-blue-400/80 font-medium' : 'text-slate-400 dark:text-slate-500'}`}>
                                  {item.desc}
                                </span>
                              </div>
                            </button>
                          );
                        })}
                      </nav>
                    </div>
                  </div>

                  {/* Drawer Footer: Integrated Light / Dark Theme Switch */}
                  <div className="p-4 border-t border-slate-100 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-900/40">
                    <div className="text-[10px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider mb-2 px-1">
                      Theme Switcher
                    </div>
                    <div className="grid grid-cols-2 p-1 bg-slate-200/70 dark:bg-slate-800/90 rounded-xl border border-slate-300/40 dark:border-slate-700/60 text-xs font-semibold">
                      <button
                        type="button"
                        onClick={() => setTheme('light')}
                        className={`flex items-center justify-center gap-1.5 py-1.5 rounded-lg transition-all cursor-pointer ${
                          theme === 'light'
                            ? 'bg-white text-slate-900 shadow-xs font-bold'
                            : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white'
                        }`}
                        aria-pressed={theme === 'light'}
                      >
                        <IconSun className="w-3.5 h-3.5 text-amber-500" />
                        <span>Light</span>
                      </button>
                      <button
                        type="button"
                        onClick={() => setTheme('dark')}
                        className={`flex items-center justify-center gap-1.5 py-1.5 rounded-lg transition-all cursor-pointer ${
                          theme === 'dark'
                            ? 'bg-slate-900 text-white shadow-xs font-bold'
                            : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white'
                        }`}
                        aria-pressed={theme === 'dark'}
                      >
                        <IconMoon className="w-3.5 h-3.5 text-blue-400" />
                        <span>Dark</span>
                      </button>
                    </div>
                  </div>
                </aside>
              </React.Fragment>
            )}

            {/* MAIN CONTENT AREA */}
            <main className={`flex-1 min-w-0 px-4 sm:px-6 lg:px-10 py-6 sm:py-8 overflow-y-auto transition-all duration-300 ${
              isNavOpen ? 'opacity-90' : ''
            }`}>
              <div className="w-full max-w-6xl mx-auto">
                {route === '/' && <LandingPage user={user} onNavigate={navigate} />}
                {route === '/auth' && <AuthPage onNavigate={navigate} onLogin={handleLogin} />}
                {route === '/dashboard' && (
                  user ? <DashboardPage onNavigate={navigate} /> : (
                    <div className="flex flex-col items-center justify-center min-h-[50vh] space-y-4 animate-fade-in text-center p-4">
                      <div className="w-10 h-10 rounded-full border-3 border-blue-200 dark:border-blue-900 border-t-blue-600 dark:border-t-blue-400 animate-spin" />
                      <div>
                        <p className="text-sm font-bold text-slate-800 dark:text-slate-200">Arming Kavach Shield...</p>
                        <p className="text-xs text-slate-500 dark:text-slate-400 mt-1">Verifying Google authentication with Supabase</p>
                      </div>
                      <button
                        type="button"
                        onClick={() => {
                          window.location.hash = '/auth';
                          setRoute('/auth');
                        }}
                        className="text-xs text-blue-600 dark:text-blue-400 underline font-semibold hover:text-blue-700 cursor-pointer pt-2"
                      >
                        Taking longer than expected? Return to Sign-In
                      </button>
                    </div>
                  )
                )}
                {user && route === '/shield' && <ShieldPage />}
                {user && route === '/spend' && <SpendPage />}
                {user && (route === '/chat' || route === '/save') && <DashboardPage onNavigate={navigate} />}
                {user && route === '/goals' && <GoalsPage />}
                {user && route === '/quiz' && <QuizPage onNavigate={navigate} />}
              </div>
            </main>

          </div>

          {/* GLOBAL FLOATING CHATBOT COPILOT */}
          {user && route !== '/' && route !== '/auth' && (
            <ChatWidget user={user} onNavigate={navigate} />
          )}

        </div>
      );
    }

    // ==========================================
    // TOP-LEVEL REACT ERROR BOUNDARY
    // ==========================================
    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }

      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }

      componentDidCatch(error, errorInfo) {
        console.error("Kavach Caught Error:", error, errorInfo);
      }

      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen flex items-center justify-center bg-slate-50 dark:bg-[#0b0f17] p-6 text-slate-900 dark:text-slate-100 text-center font-sans">
              <div className="max-w-md w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-8 shadow-2xl space-y-4">
                <div className="w-12 h-12 rounded-2xl bg-amber-100 dark:bg-amber-950/60 text-amber-600 flex items-center justify-center mx-auto">
                  <IconShieldAlert className="w-6 h-6" />
                </div>
                <h2 className="text-xl font-bold">Session Recovery</h2>
                <p className="text-xs text-slate-500 dark:text-slate-400">
                  {this.state.error?.message || "An unexpected error occurred while loading your profile."}
                </p>
                <button
                  onClick={() => {
                    try { localStorage.removeItem('kavach_user'); } catch(e) {}
                    window.location.hash = '/auth';
                    window.location.reload();
                  }}
                  className="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold rounded-xl cursor-pointer transition-all shadow-sm shadow-blue-500/20"
                >
                  Clear Session & Return to Login
                </button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
